# Runs the BootUI sample app with CRaC (Coordinated Restore at Checkpoint) using
# the simple in-memory profile:
#
#   docker compose -f docker-compose-crac.yml up --build
#
# The app starts with its default "dev" profile (in-memory H2 database and an
# in-memory cache), so no PostgreSQL or Redis is required. The startup checkpoint
# (spring.context.checkpoint=onRefresh) occurs after non-lazy singleton initialization
# but before lifecycle start; early-opened resources still need review.
# Later starts attempt restore when inventory.img exists; it is not a validity
# certificate. Incomplete directories are preserved and refused, never auto-cleaned.
# The `crac-checkpoint` named volume survives `down`/`up` cycles; inspect and preserve
# its data before explicitly choosing a fresh volume.
#
# This CRIU recipe uses Linux and the broad capabilities listed below. Use only
# on an isolated local development machine. Verify the exact JDK/CRIU/kernel/CPU combination.
#
# Running the sample app against a real PostgreSQL + Redis under CRaC is possible
# but needs ownership-aware lifecycle handling and review of early initialization,
# plus service connectivity whenever the application needs it. See the "Run it with CRaC"
# section of bootui-spring-sample-app/README.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-crac
    cap_add:
      - CHECKPOINT_RESTORE
      - SYS_PTRACE
      # Docker otherwise prevents CRIU from restoring the checkpointed PID.
      - SYS_ADMIN
      # CRIU recreates the container's network interfaces during restore.
      - NET_ADMIN
    environment:
      SERVER_PORT: 8080
      # Run the "dev" profile as an *active* profile (the image already defaults
      # to this). BootUI activates on an active profile listed in
      # bootui.enabled-profiles (dev,local,docker) - a profile set only via
      # spring.profiles.default does not count - and "dev" also selects the
      # in-memory H2 database and cache. CRaC freezes this into the checkpoint on
      # the first start.
      SPRING_PROFILES_ACTIVE: "dev"
      # Host browser requests arrive through Docker's bridge gateway rather than
      # loopback from the container's point of view. The port is bound to
      # 127.0.0.1 below, so this stays local-only on the host. This must be set
      # when the checkpoint is taken (the first start), because CRaC freezes the
      # configuration into the checkpoint image.
      BOOTUI_ALLOW_NON_LOCALHOST: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - crac-checkpoint:/opt/crac/checkpoint
    restart: unless-stopped

volumes:
  crac-checkpoint:
