name: BootUI CI assessment
description: Run live-target assessments and offline saved-bundle checks.
inputs:
  phase:
    description: Run the workload and assess it, or use prepare-cli, attach, assess, or offline for advanced integration.
    required: false
    default: run
  bootui-version:
    description: Published stable BootUI CLI version containing the ci commands; auto uses the version declared by the application.
    required: false
    default: auto
  cli-jar:
    description: Optional trusted local CLI jar for source-build testing; skips release download and signature verification and cannot be combined with an explicit bootui-version.
    required: false
  test-command:
    description: Optional shell command that exercises the started application; none runs no workload, while auto selects Maven verify or Gradle check.
    required: false
    default: none
  app-command:
    description: Foreground command that starts the application; auto detects Spring Boot or Quarkus, and none uses an externally started app.
    required: false
    default: auto
  startup-timeout:
    description: Maximum seconds to wait for the started application's BootUI CLI endpoint.
    required: false
    default: "120"
  url:
    description: Explicit HTTP URL using a literal loopback address and port.
    required: false
  assessment-id:
    description: Expected ID for offline validation or the attach and assess phases.
    required: false
  policy:
    description: Optional strict JSON policy for the default run phase; required by the advanced phases.
    required: false
  upload-artifact:
    description: Upload the sanitized reports in the default run phase.
    required: false
    default: "true"
  witness:
    description: Path to the attach witness, outside cleanable build output.
    required: false
  input-bundle:
    description: Saved assessment bundle for the offline phase; no application is contacted.
    required: false
  output-dir:
    description: Fresh directory for assessment JSON, Markdown, and JUnit reports.
    required: false
  attach-exit-code:
    description: Exit code output from this assessment's attach phase; required for assess.
    required: false
  api-path:
    description: BootUI API mount path.
    required: false
    default: /bootui/api
  timeout:
    description: Per-request timeout in seconds.
    required: false
    default: "60"
outputs:
  exit-code:
    description: Assessment result; unset for prepare-cli (0 pass, 1 not assessed/error, 3 policy violation).
    value: ${{ steps.quick_gate.outputs.exit-code || steps.report.outputs.exit-code || steps.invoke.outputs.exit-code }}
  report-dir:
    description: Fresh directory containing reports when available, including fallback reports on action failure.
    value: ${{ steps.quick_validate.outputs.report-dir || steps.report.outputs.report-dir || steps.invoke.outputs.report-dir }}
runs:
  using: composite
  steps:
    - id: quick_setup
      name: Prepare assessment
      if: ${{ inputs.phase == 'run' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_TEST_COMMAND: ${{ inputs.test-command }}
        BOOTUI_APP_COMMAND: ${{ inputs.app-command }}
        BOOTUI_STARTUP_TIMEOUT: ${{ inputs.startup-timeout }}
        BOOTUI_ASSESSMENT_ID: ${{ inputs.assessment-id }}
        BOOTUI_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
      run: bash "$ACTION_PATH/quick-setup.sh"
    - id: prepare
      name: Prepare BootUI CLI
      if: ${{ (inputs.phase != 'run' || steps.quick_setup.outcome == 'success') && (inputs.phase != 'assess' || inputs.attach-exit-code == '0') }}
      continue-on-error: ${{ inputs.phase == 'run' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_VERSION: ${{ inputs.bootui-version }}
        BOOTUI_LOCAL_CLI_JAR: ${{ inputs.cli-jar }}
        BOOTUI_PHASE: ${{ inputs.phase }}
        BOOTUI_APP_COMMAND: ${{ inputs.app-command }}
      run: bash "$ACTION_PATH/prepare-cli.sh"
    - id: quick_start
      name: Start application
      if: ${{ !cancelled() && inputs.phase == 'run' && steps.quick_setup.outcome == 'success' && steps.prepare.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_STATE_DIR: ${{ steps.quick_setup.outputs.state-dir }}
        BOOTUI_APP_COMMAND: ${{ inputs.app-command }}
        BOOTUI_URL: ${{ inputs.url || 'http://127.0.0.1:8080' }}
        BOOTUI_API_PATH: ${{ inputs.api-path }}
        BOOTUI_STARTUP_TIMEOUT: ${{ inputs.startup-timeout }}
      run: bash "$ACTION_PATH/quick-start.sh"
    - id: quick_attach
      name: Connect to BootUI
      if: ${{ !cancelled() && inputs.phase == 'run' && steps.quick_setup.outcome == 'success' && steps.prepare.outcome == 'success' && steps.quick_start.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_CLI_JAR: ${{ steps.prepare.outputs.cli-jar }}
        BOOTUI_PHASE: attach
        BOOTUI_URL: ${{ inputs.url || 'http://127.0.0.1:8080' }}
        BOOTUI_ASSESSMENT_ID: ${{ steps.quick_setup.outputs.assessment-id }}
        BOOTUI_POLICY: ${{ inputs.policy || format('{0}/.github/actions/bootui/default-policy.json', github.action_path) }}
        BOOTUI_WITNESS: ${{ steps.quick_setup.outputs.witness }}
        BOOTUI_API_PATH: ${{ inputs.api-path }}
        BOOTUI_TIMEOUT: ${{ inputs.timeout }}
      run: bash "$ACTION_PATH/invoke.sh"
    - id: quick_workload
      name: Run configured workload
      if: ${{ !cancelled() && inputs.phase == 'run' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_TEST_COMMAND: ${{ inputs.test-command }}
      run: bash "$ACTION_PATH/quick-workload.sh"
    - id: quick_assess
      name: Assess application
      if: ${{ !cancelled() && inputs.phase == 'run' && steps.quick_setup.outcome == 'success' && steps.prepare.outcome == 'success' && steps.quick_attach.outputs.exit-code == '0' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_CLI_JAR: ${{ steps.prepare.outputs.cli-jar }}
        BOOTUI_PHASE: assess
        BOOTUI_URL: ${{ inputs.url || 'http://127.0.0.1:8080' }}
        BOOTUI_ASSESSMENT_ID: ${{ steps.quick_setup.outputs.assessment-id }}
        BOOTUI_POLICY: ${{ inputs.policy || format('{0}/.github/actions/bootui/default-policy.json', github.action_path) }}
        BOOTUI_WITNESS: ${{ steps.quick_setup.outputs.witness }}
        BOOTUI_OUTPUT_DIR: ${{ steps.quick_setup.outputs.report-dir }}
        BOOTUI_ATTACH_EXIT_CODE: ${{ steps.quick_attach.outputs.exit-code }}
        BOOTUI_API_PATH: ${{ inputs.api-path }}
        BOOTUI_TIMEOUT: ${{ inputs.timeout }}
      run: bash "$ACTION_PATH/invoke.sh"
    - id: quick_report
      name: Report assessment failure
      if: ${{ !cancelled() && inputs.phase == 'run' && steps.quick_setup.outcome == 'success' && steps.quick_assess.outputs.summary-fresh != 'true' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_OUTPUT_DIR: ${{ steps.quick_setup.outputs.report-dir }}
        BOOTUI_ASSESSMENT_ID: ${{ steps.quick_setup.outputs.assessment-id }}
        BOOTUI_ATTACH_EXIT_CODE: ${{ steps.prepare.outcome == 'success' && (steps.quick_attach.outputs.exit-code || '1') || '0' }}
        BOOTUI_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        BOOTUI_APP_CONFIG_ERROR: ${{ steps.prepare.outputs.app-config-error }}
        BOOTUI_START_OUTCOME: ${{ steps.quick_start.outcome }}
      run: bash "$ACTION_PATH/report-error.sh"
    - id: quick_stop
      name: Stop application
      if: ${{ always() && inputs.phase == 'run' && steps.quick_start.outputs.pid != '' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_APP_PID: ${{ steps.quick_start.outputs.pid }}
        BOOTUI_APP_URL: ${{ inputs.url || 'http://127.0.0.1:8080' }}
      run: bash "$ACTION_PATH/quick-stop.sh"
    - id: quick_validate
      name: Publish assessment summary
      if: ${{ !cancelled() && inputs.phase == 'run' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_REPORT_DIR: ${{ steps.quick_report.outputs.report-dir || steps.quick_assess.outputs.report-dir }}
      run: bash "$ACTION_PATH/quick-report.sh"
    - id: quick_upload
      name: Upload diagnostic reports
      if: ${{ !cancelled() && inputs.phase == 'run' && inputs.upload-artifact == 'true' && steps.quick_validate.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.quick_setup.outputs.artifact-name }}
        path: |
          ${{ steps.quick_validate.outputs.report-dir }}/bundle.json
          ${{ steps.quick_validate.outputs.report-dir }}/summary.md
          ${{ steps.quick_validate.outputs.report-dir }}/junit.xml
        if-no-files-found: error
        retention-days: 7
    - id: quick_gate
      name: Check assessment result
      if: ${{ !cancelled() && inputs.phase == 'run' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_SETUP_OUTCOME: ${{ steps.quick_setup.outcome }}
        BOOTUI_APP_CONFIG_ERROR: ${{ steps.prepare.outputs.app-config-error }}
        BOOTUI_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        BOOTUI_START_OUTCOME: ${{ steps.quick_start.outcome }}
        BOOTUI_STOP_OUTCOME: ${{ steps.quick_stop.outcome }}
        BOOTUI_ATTACH_EXIT_CODE: ${{ steps.quick_attach.outputs.exit-code }}
        BOOTUI_WORKLOAD_OUTCOME: ${{ steps.quick_workload.outcome }}
        BOOTUI_ASSESS_EXIT_CODE: ${{ steps.quick_report.outputs.exit-code || steps.quick_assess.outputs.exit-code }}
        BOOTUI_REPORT_OUTCOME: ${{ steps.quick_validate.outcome }}
        BOOTUI_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
        BOOTUI_UPLOAD_OUTCOME: ${{ steps.quick_upload.outcome }}
      run: bash "$ACTION_PATH/quick-gate.sh"
    - id: invoke
      name: Run requested BootUI phase
      if: ${{ !cancelled() && inputs.phase != 'run' && inputs.phase != 'prepare-cli' && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_PHASE: ${{ inputs.phase }}
        BOOTUI_URL: ${{ inputs.url }}
        BOOTUI_ASSESSMENT_ID: ${{ inputs.assessment-id }}
        BOOTUI_POLICY: ${{ inputs.policy }}
        BOOTUI_WITNESS: ${{ inputs.witness }}
        BOOTUI_INPUT_BUNDLE: ${{ inputs.input-bundle }}
        BOOTUI_OUTPUT_DIR: ${{ inputs.output-dir }}
        BOOTUI_ATTACH_EXIT_CODE: ${{ inputs.attach-exit-code }}
        BOOTUI_API_PATH: ${{ inputs.api-path }}
        BOOTUI_TIMEOUT: ${{ inputs.timeout }}
      run: bash "$ACTION_PATH/invoke.sh"
    - id: report
      name: Report incomplete assessment
      if: ${{ !cancelled() && inputs.phase == 'assess' && steps.invoke.outputs.summary-fresh != 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}/.github/actions/bootui
        BOOTUI_OUTPUT_DIR: ${{ inputs.output-dir }}
        BOOTUI_ASSESSMENT_ID: ${{ inputs.assessment-id }}
        BOOTUI_ATTACH_EXIT_CODE: ${{ inputs.attach-exit-code }}
        BOOTUI_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
      run: bash "$ACTION_PATH/report-error.sh"
    - if: ${{ !cancelled() && inputs.phase == 'assess' }}
      name: Publish phase summary
      shell: bash
      env:
        BOOTUI_REPORT_DIR: ${{ steps.report.outputs.report-dir || steps.invoke.outputs.report-dir }}
      run: |
        if [[ -n "$BOOTUI_REPORT_DIR" && -f "$BOOTUI_REPORT_DIR/summary.md" ]]; then
          cat "$BOOTUI_REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
        else
          printf '%s\n' '## BootUI assessment unavailable' '' \
            'No valid assessment summary was produced. Check the action step output and preserve any files that were written.' \
            >> "$GITHUB_STEP_SUMMARY"
        fi
    - if: ${{ !cancelled() && inputs.phase != 'run' && inputs.phase != 'prepare-cli' }}
      name: Check phase result
      shell: bash
      env:
        BOOTUI_ACTION_EXIT_CODE: ${{ steps.invoke.outputs.exit-code }}
        BOOTUI_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        BOOTUI_INVOKE_OUTCOME: ${{ steps.invoke.outcome }}
        BOOTUI_REPORT_OUTCOME: ${{ steps.report.outcome }}
      run: |
        if [[ -n "$BOOTUI_REPORT_OUTCOME" && "$BOOTUI_REPORT_OUTCOME" != "skipped" ]]; then
          echo "::error::BootUI could not produce a trustworthy assessment."
          exit 1
        fi
        if [[ "$BOOTUI_PREPARE_OUTCOME" != "success" || "$BOOTUI_INVOKE_OUTCOME" != "success" ]]; then
          echo "::error::BootUI CLI setup or invocation failed."
          exit 1
        fi
        case "$BOOTUI_ACTION_EXIT_CODE" in
          0) exit 0 ;;
          1) echo "::error::BootUI could not complete a trustworthy assessment."; exit 1 ;;
          3) echo "::error::BootUI found a policy-threshold violation."; exit 1 ;;
          *) echo "::error::BootUI returned an invalid aggregate exit code."; exit 1 ;;
        esac
