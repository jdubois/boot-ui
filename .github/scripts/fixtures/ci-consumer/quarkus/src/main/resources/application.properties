quarkus.application.name=bootui-ci-quarkus-consumer
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
%bootui-ci.quarkus.http.auth.basic=true
%bootui-ci.quarkus.http.insecure-requests=enabled
%bootui-ci.quarkus.security.users.embedded.enabled=true
%bootui-ci.quarkus.security.users.embedded.plain-text=true
%bootui-ci.quarkus.security.users.embedded.users.ci=${CI_CONSUMER_PASSWORD}
%bootui-ci.quarkus.security.users.embedded.roles.ci=user
%bootui-ci.quarkus.http.auth.permission.orders.paths=/orders
%bootui-ci.quarkus.http.auth.permission.orders.policy=authenticated
%bootui-ci.quarkus.http.auth.permission.admin.paths=/admin/*
%bootui-ci.quarkus.http.auth.permission.admin.policy=authenticated
%bootui-ci.quarkus.http.auth.permission.bootui.paths=/diagnostics/api/*
%bootui-ci.quarkus.http.auth.permission.bootui.policy=permit
quarkus.log.console.color=false
