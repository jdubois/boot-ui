name: JDK compatibility (21/25/27)

# Keeps Java 17 as the full CI-equivalent/build-release baseline (build.yml + release.yml),
# while adding focused compatibility checks on newer supported JDKs for every push to main and
# to the long-lived v2 branch (PLAN-v2 M5-12: the BootUI agent's acceptance matrix covers Java 21
# and 25 there too, with the Spring MVC browser suite attached to the agent), every pull request into main, pull requests into v2 that change an
# agent-related path or carry the `agent` label (.github/scripts/agent-changes.sh), and a nightly
# scheduled run.
on:
  push:
    branches: [ main, v2 ]
  pull_request:
    branches: [ main, v2 ]
    # `labeled` too, so adding the `agent` label runs the agent legs (.github/scripts/agent-changes.sh).
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    # Every night at 03:05 UTC.
    - cron: '5 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests into v2 that change nothing the agent depends on skip these lanes; pushes to main and v2, the nightly
  # run, and pull requests into main run them all.
  changes:
    name: Agent-related changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.agent.outputs.agent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether the lanes run
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORCE_ALL: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: bash .github/scripts/agent-changes.sh

  compatibility:
    name: Focused compatibility (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    # The agent integration tests start the Spring sample three times on top of the focused build.
    timeout-minutes: 45
    # Java 27 is ahead of the frameworks' documented support (Spring Boot 4.1 covers 17-26,
    # Quarkus 3.33 LTS covers 17/21/25), so it runs as an informational early-warning lane
    # rather than a gate. Promote it to blocking once both frameworks support it.
    continue-on-error: ${{ matrix.java == '27' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            distribution: temurin
          - java: '25'
            distribution: temurin
          # Temurin has not published a Java 27 build yet, so this lane uses Zulu
          # Community. Move it back to temurin once Adoptium ships 27.
          - java: '27'
            distribution: zulu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test shared engine + adapters
        # Focused coverage for Java 21/25/27: run the servlet, reactive and Quarkus
        # conformance suites while avoiding browser and optional-extension suites.
        # Select the Quarkus base module directly because selecting its aggregator
        # does not include child modules in a Maven -pl build.
        run: >
          ./mvnw -T 1C -B -ntp
          -pl bootui-spring-sample-app,bootui-spring-webflux-sample-app,bootui-quarkus-integration-tests/base
          -am test

      - name: Agent forked-JVM tests
        # The BootUI agent's behaviour is JDK-specific (Byte Buddy class-file support, the
        # privileged install that only matters on JDK 17 to 23, virtual threads): run its
        # forked-JVM integration tests (layout, dormancy, coexistence, leak walk) on each lane.
        # Java 17 runs them in build.yml's full reactor.
        run: ./mvnw -B -ntp -pl bootui-agent-bridge,bootui-agent -am verify

      - name: Spring sample with the agent attached
        # The sample in a JVM of its own with -javaagent (PLAN-v2 M5-12): the correlation scenario's
        # propagated executor work, work after the response, Code Inventory, and Code Paths
        # (SpringAgentScenarioIT), and the same agent on the repackaged executable jar, whose classes
        # load from jar:nested: URLs (SpringAgentExecutableJarIT). Java 17 runs them in build.yml's
        # full reactor.
        run: >
          ./mvnw -T 1C -B -ntp -pl bootui-spring-sample-app -am verify
          -Dit.test='SpringAgent*IT' -Dfailsafe.failIfNoSpecifiedTests=false
          -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false

      - name: Exercise Quarkus sample app augmentation
        # Ensures Quarkus build-time augmentation runs on JDK 17 to 27 and catches
        # ByteBuddy/build-plugin regressions without running browser tests. On JDK 28+
        # the module's own skip profile unbinds augmentation, so this only proves plain
        # compile + jar there.
        run: ./mvnw -T 1C -B -ntp -pl bootui-quarkus-sample-app -am -DskipTests install

  # The whole Spring MVC browser suite with the BootUI agent attached (PLAN-v2 §5.13, M5-12) on the newer supported JDKs
  # the agent's class-file and JDK hooks must hold on; Java 17 runs it in build.yml, with the companion-agent legs. One
  # MVC leg per JDK keeps the cost reasonable: WebFlux and Quarkus share the engine and the agent.
  agent-e2e:
    name: Spring end-to-end with the BootUI agent (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: bootui-spring-sample-app/e2e/package-lock.json

      # The sample's -am build includes bootui-agent, its test-scope dependency, which the suite attaches.
      - name: Build the Spring sample app and the BootUI agent
        run: ./mvnw -T 1C -B -ntp -pl bootui-spring-sample-app -am -DskipTests install

      - name: Install Playwright dependencies
        working-directory: bootui-spring-sample-app/e2e
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        # apt-get can stall for hours on a runner's package mirror: fail fast, so a rerun gets another runner.
        timeout-minutes: 10
        working-directory: bootui-spring-sample-app/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests with the agent
        working-directory: bootui-spring-sample-app/e2e
        run: npm run test:agent

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-agent-java-${{ matrix.java }}
          path: |
            bootui-spring-sample-app/e2e/playwright-report-agent/
            bootui-spring-sample-app/e2e/test-results-agent/
          if-no-files-found: ignore
          retention-days: 7
