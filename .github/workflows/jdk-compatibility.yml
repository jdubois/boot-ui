name: JDK compatibility (21/25/27)

# Keeps Java 17 as the full CI-equivalent/build-release baseline (build.yml + release.yml),
# while adding focused compatibility checks on newer supported JDKs for every PR/push and
# a weekly scheduled run.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Every Monday at 07:05 UTC.
    - cron: '5 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Focused compatibility (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Java 27 is ahead of the frameworks' documented support (Spring Boot 4.1 covers 17-26,
    # Quarkus 3.33 LTS covers 17/21/25), so it runs as an informational early-warning lane
    # rather than a gate. Promote it to blocking once both frameworks support it.
    continue-on-error: ${{ matrix.java == '27' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            distribution: temurin
          - java: '25'
            distribution: temurin
          # Temurin has not published a Java 27 build yet, so this lane uses Zulu
          # Community. Move it back to temurin once Adoptium ships 27.
          - java: '27'
            distribution: zulu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test shared engine + adapters
        # Focused coverage for Java 21/25/27: run the servlet, reactive and Quarkus
        # conformance suites while avoiding browser and optional-extension suites.
        # Select the Quarkus base module directly because selecting its aggregator
        # does not include child modules in a Maven -pl build.
        run: >
          ./mvnw -T 1C -B -ntp
          -pl bootui-spring-sample-app,bootui-spring-webflux-sample-app,bootui-quarkus-integration-tests/base
          -am test

      - name: Agent forked-JVM tests
        # The BootUI agent's behaviour is JDK-specific (Byte Buddy class-file support, the
        # privileged install that only matters on JDK 17 to 23, virtual threads): run its
        # forked-JVM integration tests (layout, dormancy, coexistence, leak walk) on each lane.
        # Java 17 runs them in build.yml's full reactor.
        run: ./mvnw -B -ntp -pl bootui-agent-bridge,bootui-agent -am verify

      - name: Exercise Quarkus sample app augmentation
        # Ensures Quarkus build-time augmentation runs on JDK 17 to 27 and catches
        # ByteBuddy/build-plugin regressions without running browser tests. On JDK 28+
        # the module's own skip profile unbinds augmentation, so this only proves plain
        # compile + jar there.
        run: ./mvnw -T 1C -B -ntp -pl bootui-quarkus-sample-app -am -DskipTests install
