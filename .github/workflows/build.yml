name: Build (Java 17 baseline)

on:
  push:
    branches: [ main, v2 ]
  pull_request:
    branches: [ main, v2 ]
    # `labeled` too, so adding the `agent` label runs the agent legs (.github/scripts/agent-changes.sh).
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # Whether this run exercises the BootUI agent's legs (PLAN-v2 M5-12): pushes to main and v2 always do; a pull request
  # does when it is labelled `agent` or changes an agent-related path (.github/scripts/agent-changes.sh), so the
  # agent-attached Playwright legs and the overhead benchmark don't queue for every pull request.
  changes:
    name: Agent-related changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.agent.outputs.agent }}
      extras: ${{ steps.agent.outputs.extras }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether the agent legs run
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash .github/scripts/agent-changes.sh

  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check GitHub Action references
        run: bash .github/scripts/check-action-references.sh

      - name: Test GitHub Action reference policy
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_action_references.py'

      - name: Check release workflow integrity
        run: bash .github/scripts/check-release-integrity.sh

      - name: Test release version policy and integrity guard
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_release_*.py'

      - name: Check Docker workflow expressions
        run: >
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck= -pyflakes=
          .github/workflows/docker-publish.yml .github/workflows/build.yml

      - name: Test Docker image retention
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_docker_retention*.py'

      - name: Test MySQL live-evidence gate
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_mysql_live_tests.py'

      # The validation harness is not built or published; its scorer and scripts are checked so the registered
      # protocol stays computable (docs/V2-VALIDATION-REPORT.md, "Protocol for the rerun").
      - name: Test the validation harness
        run: |
          node --test validation/scoring/score.test.mjs validation/bin/await-restart.test.mjs
          for script in validation/bin/*.sh validation/apps/*/app.sh; do bash -n "$script"; done
          for script in validation/bin/*.mjs validation/traffic/*.mjs validation/stubs/*.mjs; do node --check "$script"; done

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            bootui-ui/src/main/frontend/package-lock.json
            bootui-spring-sample-app/e2e/package-lock.json

      - name: Check Maven formatting
        run: ./mvnw -B -ntp spotless:check

      # -T 1C: one reactor thread per available CPU core. Safe because every module that triggers Quarkus
      # build-time augmentation declares an explicit provided-scope dependency on bootui-quarkus-deployment
      # (so the reactor always orders it first) and every @QuarkusTest-bearing module pins Surefire's
      # forkCount to a value that does not race Quarkus's own test-bootstrap classloading (see the
      # maven-surefire-plugin comment in the root pom and the forkCount comment in
      # bootui-quarkus-integration-tests/base/pom.xml).
      # -Dbootui.skipQuarkusExtensionIts leaves the per-extension Quarkus integration-test modules to the
      # parallel quarkus-extension-its job below; none of them feeds the bootui-coverage aggregate.
      - name: Build all modules with coverage
        run: ./mvnw -T 1C -B -ntp -Pcoverage -Dbootui.skipQuarkusExtensionIts clean install

      - name: Require executed MySQL collector, Spring HTTP, and activity store tests
        run: >
          python3 .github/scripts/check-mysql-live-tests.py
          bootui-spring-boot-starter/target/surefire-reports
          MySqlExecutionLiveTests MySqlPermissionsLiveTests MySqlCollectorsLiveTests
          MySqlReplicationLiveTests MySqlDigestOverflowLiveTests MySqlPerformanceSchemaOffLiveTests
          MySqlInstrumentationLiveTests MySqlIdentifierCaseLiveTests MySqlHttpLiveTests
          MySqlActivityStoreLiveTests

      # The panel claims two Oracle MySQL LTS lines. The full build above covers 8.4; this reruns the Spring panel's
      # live suites against 9.7 (the quarkus-its job reruns the Quarkus contract). Earlier reports are set aside so 8.4
      # evidence cannot satisfy the 9.7 gate, then restored for the published test report; the collector tests assert
      # the reported server line.
      - name: Run MySQL panel live suites on MySQL 9.7 LTS
        run: |
          spring=bootui-spring-boot-starter/target
          mv "$spring/surefire-reports" "$spring/surefire-reports-mysql-8.4"
          ./mvnw -B -ntp -pl bootui-spring-boot-starter test -Dbootui.mysql.image=mysql:9.7.2 \
            -Dtest='MySqlExecutionLiveTests,MySqlPermissionsLiveTests,MySqlCollectorsLiveTests,MySqlReplicationLiveTests,MySqlDigestOverflowLiveTests,MySqlPerformanceSchemaOffLiveTests,MySqlInstrumentationLiveTests,MySqlIdentifierCaseLiveTests,MySqlHttpLiveTests'
          python3 .github/scripts/check-mysql-live-tests.py "$spring/surefire-reports" \
            MySqlExecutionLiveTests MySqlPermissionsLiveTests MySqlCollectorsLiveTests \
            MySqlReplicationLiveTests MySqlDigestOverflowLiveTests MySqlPerformanceSchemaOffLiveTests \
            MySqlInstrumentationLiveTests MySqlIdentifierCaseLiveTests MySqlHttpLiveTests
          mv "$spring/surefire-reports" "$spring/surefire-reports-mysql-9.7"
          mv "$spring/surefire-reports-mysql-8.4" "$spring/surefire-reports"

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: bash .github/scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      # Aggregates dependencies from every reactor module (already installed above) into one CycloneDX
      # SBOM. Invoked as a standalone goal (not bound to a lifecycle phase in pom.xml) so it never attaches
      # to, or is published alongside, release artifacts - see the cyclonedx-maven-plugin comment in pom.xml.
      - name: Generate CycloneDX SBOM
        if: success()
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Upload SBOM
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bootui-sbom
          path: target/bootui-sbom.json
          if-no-files-found: error
          retention-days: 90

      - name: Check frontend formatting
        working-directory: bootui-ui/src/main/frontend
        run: npm run format:check

      - name: Publish Java test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Java tests (Surefire)
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Publish frontend unit test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Frontend unit tests (Vitest)
          path: bootui-ui/src/main/frontend/test-results/vitest-junit.xml
          reporter: jest-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload JUnit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            bootui-ui/src/main/frontend/test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 7

      # Surefire and Failsafe redirect each test class's stdout/stderr to these files (see the root pom), so
      # this artifact is where to read application logs and stack traces printed by tests.
      - name: Upload test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            **/target/surefire-reports/*-output.txt
            **/target/failsafe-reports/*-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-java-${{ matrix.java }}
          path: |
            **/target/site/jacoco/
            bootui-coverage/target/site/jacoco-aggregate/
            bootui-ui/src/main/frontend/coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload sample-app jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bootui-spring-sample-app
          path: bootui-spring-sample-app/target/*.jar
          if-no-files-found: warn
          retention-days: 7

  quarkus-extension-its:
    name: Quarkus extension integration tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: bootui-ui/src/main/frontend/package-lock.json

      # Install, without running their tests, the modules the per-extension integration tests consume. The
      # build job above runs those tests with coverage; this job runs in parallel with it.
      - name: Install BootUI Quarkus extension and conformance suite
        run: >
          ./mvnw -T 1C -B -ntp
          -pl bootui-conformance,bootui-quarkus-deployment,bootui-quarkus-integration-tests
          -am -DskipTests install

      # Selecting the aggregator with -amd picks up every child module, including the JDK-gated Hibernate
      # module, so a new integration-test module needs no workflow change. The base module is excluded because
      # the build job runs it: its execution data feeds the bootui-coverage aggregate. -T 1C is safe for the
      # same reasons as in the build job, and bootui-quarkus-deployment is already installed.
      - name: Test Quarkus extension integration modules
        run: >
          ./mvnw -T 1C -B -ntp
          -pl 'bootui-quarkus-integration-tests,!bootui-quarkus-integration-tests/base'
          -amd verify

      - name: Run MySQL Quarkus HTTP contract
        run: >
          ./mvnw -B -ntp -pl bootui-quarkus-integration-tests/datasource
          -Pmysql-live test -Dtest=BootUiQuarkusMySqlLiveTest

      - name: Require executed MySQL Quarkus HTTP tests
        run: >
          python3 .github/scripts/check-mysql-live-tests.py
          bootui-quarkus-integration-tests/datasource/target/surefire-reports
          BootUiQuarkusMySqlLiveTest

      # Reruns the Quarkus MySQL HTTP contract against the second tested LTS line, 9.7, setting the 8.4 reports aside
      # so they cannot satisfy this gate, then restoring them for the published test report.
      - name: Run MySQL Quarkus HTTP contract on MySQL 9.7 LTS
        run: |
          quarkus=bootui-quarkus-integration-tests/datasource/target
          mv "$quarkus/surefire-reports" "$quarkus/surefire-reports-mysql-8.4"
          ./mvnw -B -ntp -pl bootui-quarkus-integration-tests/datasource \
            -Pmysql-live test -Dtest=BootUiQuarkusMySqlLiveTest -Dbootui.mysql.image=mysql:9.7.2
          python3 .github/scripts/check-mysql-live-tests.py "$quarkus/surefire-reports" BootUiQuarkusMySqlLiveTest
          mv "$quarkus/surefire-reports" "$quarkus/surefire-reports-mysql-9.7"
          mv "$quarkus/surefire-reports-mysql-8.4" "$quarkus/surefire-reports"

      - name: Publish Java test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Quarkus extension integration tests (Surefire)
          path: 'bootui-quarkus-integration-tests/*/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload JUnit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-reports-quarkus-extension-its
          path: bootui-quarkus-integration-tests/*/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-output-quarkus-extension-its
          path: bootui-quarkus-integration-tests/*/target/surefire-reports/*-output.txt
          if-no-files-found: ignore
          retention-days: 7

  # One leg per Playwright suite: each suite boots its own sample app(s), so running them on separate runners
  # instead of back to back roughly divides this job's duration by three.
  spring-e2e:
    name: Spring end-to-end (${{ matrix.suite.name }}, Java 17)
    runs-on: ubuntu-latest
    needs: changes
    env:
      # An agent leg with nothing agent-related to check passes without starting anything (see the changes job).
      SKIP_LEG: ${{ matrix.suite.agent == true && needs.changes.outputs.agent != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: mvc
            name: MVC
            script: test
            report-name: End-to-end tests (Playwright)
            report-dir: playwright-report
            results-dir: test-results
          - id: webflux
            name: WebFlux
            script: test:webflux
            report-name: WebFlux end-to-end tests (Playwright)
            report-dir: playwright-report-webflux
            results-dir: test-results-webflux
          - id: custom-path
            name: custom path
            script: test:custom-path
            report-name: Custom-path end-to-end tests (Playwright)
            report-dir: playwright-report-custom-path
            results-dir: test-results-custom-path
          # The MVC sample with the BootUI agent attached (PLAN-v2 M5-2): the executors sensor, propagated work in
          # Live Activity, and work-after-response. Its agent jar comes from the install step's -am build.
          - id: agent
            name: MVC with the BootUI agent
            script: test:agent
            report-name: Agent end-to-end tests (Playwright)
            report-dir: playwright-report-agent
            results-dir: test-results-agent
            agent: true
          # The whole WebFlux suite with the BootUI agent attached (PLAN-v2 M5-12): every spec holds with the agent, and
          # the Java Agent, Code Inventory, and Code Paths specs assert the armed claim and the recorded run instead.
          - id: webflux-agent
            name: WebFlux with the BootUI agent
            script: test:webflux:agent
            report-name: WebFlux agent end-to-end tests (Playwright)
            report-dir: playwright-report-webflux-agent
            results-dir: test-results-webflux-agent
            agent: true
    steps:
      - name: Skip the agent leg when nothing agent-related changed
        if: env.SKIP_LEG == 'true'
        run: echo "::notice::No agent-related change in this pull request; label it agent to run this leg."

      - name: Checkout
        if: env.SKIP_LEG != 'true'
        uses: actions/checkout@v7

      - name: Set up JDK 17
        if: env.SKIP_LEG != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        if: env.SKIP_LEG != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: bootui-spring-sample-app/e2e/package-lock.json

      # Install only the Spring sample apps and their dependencies so Playwright can start them.
      # This intentionally runs in parallel with the full coverage reactor above.
      - name: Build Spring sample apps
        if: env.SKIP_LEG != 'true'
        run: >
          ./mvnw -T 1C -B -ntp
          -pl bootui-spring-sample-app,bootui-spring-webflux-sample-app
          -am -DskipTests install

      # The agent legs attach bootui-agent/target/bootui-agent-*.jar, which the -am build above produces as the Spring
      # sample's test-scope dependency: fail here, clearly, rather than with a raw ENOENT from Playwright's config.
      - name: Check the BootUI agent jar
        if: env.SKIP_LEG != 'true' && (matrix.suite.agent)
        run: |
          if ! ls bootui-agent/target/bootui-agent-*.jar > /dev/null 2>&1; then
            echo "::error::bootui-agent/target/bootui-agent-*.jar is missing: the Spring sample build must build bootui-agent (-am)."
            exit 1
          fi

      - name: Install Playwright dependencies
        if: env.SKIP_LEG != 'true'
        working-directory: bootui-spring-sample-app/e2e
        run: npm ci --ignore-scripts

      - name: Check Playwright formatting
        if: env.SKIP_LEG != 'true' && (matrix.suite.id == 'mvc')
        working-directory: bootui-spring-sample-app/e2e
        run: npm run format:check

      - name: Install Playwright browsers
        if: env.SKIP_LEG != 'true'
        working-directory: bootui-spring-sample-app/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        if: env.SKIP_LEG != 'true'
        working-directory: bootui-spring-sample-app/e2e
        run: npm run "${{ matrix.suite.script }}"

      - name: Publish end-to-end test report
        if: env.SKIP_LEG != 'true' && (!cancelled())
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: ${{ matrix.suite.report-name }}
          path: bootui-spring-sample-app/e2e/${{ matrix.suite.results-dir }}/junit/results.xml
          reporter: jest-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Playwright report
        if: env.SKIP_LEG != 'true' && (!cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite.report-dir }}
          path: |
            bootui-spring-sample-app/e2e/${{ matrix.suite.report-dir }}/
            bootui-spring-sample-app/e2e/${{ matrix.suite.results-dir }}/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload end-to-end JUnit test report
        if: env.SKIP_LEG != 'true' && (!cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-reports-spring-e2e-${{ matrix.suite.id }}
          path: bootui-spring-sample-app/e2e/${{ matrix.suite.results-dir }}/junit/results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Builds the Maven Central bundle a release would upload, without uploading or signing it, checks that it
  # holds exactly the published coordinates with flattened, parentless POMs, and runs the release's consumer
  # smoke tests against it as a file repository (.github/scripts/stage-release-candidate.sh and
  # consumer-smoke-tests.sh). release.yml runs the same scripts before tagging; this catches a broken consumer
  # POM, or a starter that chooses the application's web stack, in the pull request that causes it.
  release-candidate:
    name: Staged release candidate smoke tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: bootui-ui/src/main/frontend/package-lock.json

      - name: Stage the release candidate
        run: bash .github/scripts/stage-release-candidate.sh "$RUNNER_TEMP/bootui-candidate"

      - name: Smoke test the staged release candidate
        run: |
          VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          SMOKE_LOCAL_REPO="$RUNNER_TEMP/bootui-candidate-consumers" \
            bash .github/scripts/consumer-smoke-tests.sh "$VERSION" "$RUNNER_TEMP/bootui-candidate"

  # The BootUI agent's cumulative overhead (PLAN-v2 §5.13, §8, M5-12): the Spring sample's executable jar without the
  # agent and with every default sensor claimed, BootUI on in both, in five alternating pairs. The budget is 10 %: the
  # job records the report in its summary and warns above the budget, but fails only above 30 %, so a noisy shared
  # runner never fails a build while a clear regression does. The first CI runs measured about 17 % (pairs from 9 to
  # 22 %), above the budget, so a gate any closer to it would fail on noise alone (see CONTRIBUTING.md). Two more
  # measurements run on the I/O route, which adds one outbound connect and one file read per request so the
  # side-effect sensors that hook them are exercised (M5-5b): every default sensor against no agent, nine pairs, on
  # every agent run; and, on pushes, manual runs, and pull requests labelled `agent` only, the default sensors against
  # the same agent without network, the network sensor's own share, then the opt-in files sensor's own share (the
  # default sensors plus files against the default sensors, fifteen pairs) and the cumulative overhead with it (nine
  # pairs against no agent), which decide whether files can be on by default (D37): on with files' own median at most
  # 3 % and the cumulative median at most 10 %. The first run measured 2.3 % and 10.6 %, so files stays opt-in.
  agent-overhead:
    name: Agent overhead (Java 17)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: bootui-ui/src/main/frontend/package-lock.json

      # The sample's -am build includes bootui-agent, its test-scope dependency.
      - name: Build the Spring sample app and the BootUI agent
        run: ./mvnw -T 1C -B -ntp -pl bootui-spring-sample-app -am -DskipTests install

      - name: Measure the agent's overhead
        run: >
          ./mvnw -B -ntp -pl bootui-spring-sample-app verify
          -Dbootui.benchmark=true -Dbootui.benchmark.passes=5 -Dbootui.benchmark.agent.fail-above-percent=30
          -Dit.test=AgentOverheadBenchmarkIT -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false

      - name: Measure the agent's overhead on the I/O route
        run: >
          ./mvnw -B -ntp -pl bootui-spring-sample-app verify
          -Dbootui.benchmark=true -Dbootui.benchmark.passes=9 -Dbootui.benchmark.agent.fail-above-percent=30
          -Dbootui.benchmark.route=io -Dbootui.benchmark.report=spring-mvc-agent-io
          -Dit.test=AgentOverheadBenchmarkIT -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false

      - name: Measure the network sensor's share on the I/O route
        if: needs.changes.outputs.extras == 'true'
        run: >
          ./mvnw -B -ntp -pl bootui-spring-sample-app verify
          -Dbootui.benchmark=true -Dbootui.benchmark.passes=9 -Dbootui.benchmark.agent.fail-above-percent=30
          -Dbootui.benchmark.route=io -Dbootui.benchmark.report=spring-mvc-network-ab
          -Dbootui.benchmark.agent.baseline-sensors=executors,inventory,code-paths,processes
          -Dit.test=AgentOverheadBenchmarkIT -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false

      - name: Measure the files sensor's share on the I/O route
        if: needs.changes.outputs.extras == 'true'
        run: >
          ./mvnw -B -ntp -pl bootui-spring-sample-app verify
          -Dbootui.benchmark=true -Dbootui.benchmark.passes=15 -Dbootui.benchmark.agent.fail-above-percent=30
          -Dbootui.benchmark.route=io -Dbootui.benchmark.report=spring-mvc-files-ab
          -Dbootui.benchmark.agent.sensors=executors,inventory,code-paths,processes,network,files
          -Dbootui.benchmark.agent.baseline-sensors=executors,inventory,code-paths,processes,network
          -Dit.test=AgentOverheadBenchmarkIT -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false

      - name: Measure the agent's overhead with files on the I/O route
        if: needs.changes.outputs.extras == 'true'
        run: >
          ./mvnw -B -ntp -pl bootui-spring-sample-app verify
          -Dbootui.benchmark=true -Dbootui.benchmark.passes=9 -Dbootui.benchmark.agent.fail-above-percent=30
          -Dbootui.benchmark.route=io -Dbootui.benchmark.report=spring-mvc-agent-io-files
          -Dbootui.benchmark.agent.sensors=executors,inventory,code-paths,processes,network,files
          -Dit.test=AgentOverheadBenchmarkIT -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false

      - name: Publish the overhead report
        if: ${{ !cancelled() }}
        run: |
          directory=bootui-spring-sample-app/target/agent-overhead
          if [ ! -f "$directory/spring-mvc-agent.md" ]; then
            echo "::warning::The agent overhead benchmark wrote no report."
            exit 0
          fi
          cat "$directory/spring-mvc-agent.md" >> "$GITHUB_STEP_SUMMARY"
          overhead=$(sed -n 's/^overheadPercent=//p' "$directory/summary.properties")
          budget=$(sed -n 's/^budgetPercent=//p' "$directory/summary.properties")
          if awk -v overhead="$overhead" -v budget="$budget" 'BEGIN { exit !(overhead > budget) }'; then
            echo "::warning::The BootUI agent's median overhead is ${overhead} %, above its ${budget} % budget."
          fi
          for report in spring-mvc-agent-io spring-mvc-network-ab spring-mvc-files-ab spring-mvc-agent-io-files; do
            if [ -f "$directory/$report.md" ]; then
              cat "$directory/$report.md" >> "$GITHUB_STEP_SUMMARY"
              overhead=$(sed -n 's/^overheadPercent=//p' "$directory/$report.properties")
              if awk -v overhead="$overhead" -v budget="$budget" 'BEGIN { exit !(overhead > budget) }'; then
                echo "::warning::The ${report} median overhead is ${overhead} %, above its ${budget} % budget."
              fi
            fi
          done

      - name: Upload the overhead report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-overhead
          path: |
            bootui-spring-sample-app/target/agent-overhead/
            bootui-spring-sample-app/target/failsafe-reports/*AgentOverheadBenchmarkIT*
          if-no-files-found: ignore
          retention-days: 30

  quarkus-e2e:
    name: Quarkus end-to-end (${{ matrix.suite.name }}, Java 17)
    runs-on: ubuntu-latest
    needs: changes
    env:
      # An agent leg with nothing agent-related to check passes without starting anything (see the changes job).
      SKIP_LEG: ${{ matrix.suite.id == 'agent' && needs.changes.outputs.agent != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: default
            name: default
            script: test
            modules: bootui-quarkus-sample-app
            report-name: Quarkus end-to-end tests (Playwright)
            report-dir: playwright-report
            results-dir: test-results
            artifact: quarkus-playwright-report
          # The whole suite against quarkus:dev with the BootUI agent attached (PLAN-v2 M5-12): every spec holds with
          # the agent, and the Java Agent, Code Inventory, and Code Paths specs assert the armed claim and the recorded
          # run instead. The Quarkus sample does not depend on bootui-agent, so this leg builds it too.
          - id: agent
            name: with the BootUI agent
            script: test:agent
            modules: bootui-quarkus-sample-app,bootui-agent
            report-name: Quarkus agent end-to-end tests (Playwright)
            report-dir: playwright-report-agent
            results-dir: test-results-agent
            artifact: quarkus-playwright-report-agent
    steps:
      - name: Skip the agent leg when nothing agent-related changed
        if: env.SKIP_LEG == 'true'
        run: echo "::notice::No agent-related change in this pull request; label it agent to run this leg."

      - name: Checkout
        if: env.SKIP_LEG != 'true'
        uses: actions/checkout@v7

      # The Quarkus sample app can augment on JDK 17/21/25 (Hibernate ORM ByteBuddy cannot read
      # JDK 26+ class files), while the authoritative end-to-end baseline remains Java 17.
      - name: Set up JDK 17
        if: env.SKIP_LEG != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        if: env.SKIP_LEG != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: |
            bootui-quarkus-sample-app/e2e/package-lock.json

      # Build and install the BootUI Quarkus extension + the sample app into the local Maven
      # repository so Playwright's `quarkus:dev` web server can resolve them. BootUI activates
      # automatically under `quarkus:dev` (dev mode); it stays dark in a packaged prod run.
      # bootui-quarkus-sample-app (and every Quarkus consumer module) declares an explicit provided-scope
      # dependency on bootui-quarkus-deployment, so plain -am now resolves it into the reactor; Quarkus
      # would otherwise only pull the -deployment counterpart in at augmentation time (not via Maven's
      # dependency graph), which is invisible to -am and, under a parallel (-T) build, is also an
      # unordered race with the deployment module's own build.
      # -T 1C is safe here even without the Surefire forkCount guards above: -DskipTests means no
      # @QuarkusTest classloading race is possible, and -am's ordering relies only on the same explicit
      # provided-scope bootui-quarkus-deployment dependency called out above.
      - name: Build BootUI Quarkus extension and sample app
        if: env.SKIP_LEG != 'true'
        run: ./mvnw -T 1C -B -ntp -pl "${{ matrix.suite.modules }}" -am -DskipTests install

      - name: Check the BootUI agent jar
        if: env.SKIP_LEG != 'true' && (matrix.suite.id == 'agent')
        run: |
          if ! ls bootui-agent/target/bootui-agent-*.jar > /dev/null 2>&1; then
            echo "::error::bootui-agent/target/bootui-agent-*.jar is missing: the agent leg must build bootui-agent."
            exit 1
          fi

      - name: Install Playwright dependencies
        if: env.SKIP_LEG != 'true'
        working-directory: bootui-quarkus-sample-app/e2e
        run: npm ci --ignore-scripts

      - name: Check Playwright formatting
        if: env.SKIP_LEG != 'true' && (matrix.suite.id == 'default')
        working-directory: bootui-quarkus-sample-app/e2e
        run: npm run format:check

      - name: Install Playwright browsers
        if: env.SKIP_LEG != 'true'
        working-directory: bootui-quarkus-sample-app/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # ubuntu-latest ships with Docker, which Quarkus Dev Services needs to start the throwaway
      # PostgreSQL container the sample app boots against.
      - name: Run Quarkus Playwright end-to-end tests
        if: env.SKIP_LEG != 'true'
        working-directory: bootui-quarkus-sample-app/e2e
        run: npm run "${{ matrix.suite.script }}"

      - name: Publish Quarkus end-to-end test report
        if: env.SKIP_LEG != 'true' && (!cancelled())
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: ${{ matrix.suite.report-name }}
          path: bootui-quarkus-sample-app/e2e/${{ matrix.suite.results-dir }}/junit/results.xml
          reporter: jest-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Quarkus Playwright report
        if: env.SKIP_LEG != 'true' && (!cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite.artifact }}
          path: |
            bootui-quarkus-sample-app/e2e/${{ matrix.suite.report-dir }}/
            bootui-quarkus-sample-app/e2e/${{ matrix.suite.results-dir }}/
          if-no-files-found: ignore
          retention-days: 7
