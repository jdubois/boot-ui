name: Publish Docker images

# Builds the six sample-app container images from the root Dockerfiles and
# publishes them to Docker Hub as multi-arch images (linux/amd64 + linux/arm64):
#
#   Dockerfile         -> <user>/bootui-sample-app          (JVM image)
#   Dockerfile-aot     -> <user>/bootui-sample-app-aot      (JVM + Spring AOT + JDK cache image)
#   Dockerfile-crac    -> <user>/bootui-sample-app-crac     (CRaC image)
#   Dockerfile-native  -> <user>/bootui-sample-app-native   (GraalVM native image)
#   Dockerfile-webflux -> <user>/bootui-sample-app-webflux  (Spring WebFlux/Netty reactive JVM image)
#   Dockerfile-quarkus -> <user>/bootui-sample-app-quarkus  (Quarkus JVM dev-mode image, a separate sample app)
#
# Each Dockerfile copies the whole multi-module reactor and builds its sample app from
# that reactor, so the build context is the repository root. (The four servlet Spring images
# build `bootui-spring-sample-app`; the WebFlux image builds `bootui-spring-webflux-sample-app`;
# the Quarkus image builds `bootui-quarkus-sample-app`.)
#
# The images are published once a day from the main branch (scheduled events run
# against the default branch) and can also be built on demand from the Actions tab.
#
# Release tagging starts only after every image/platform passes its smoke test.
# Each verified platform image first receives a unique build-* retention tag so it
# remains discoverable even if another build fails or the workflow is interrupted.
# These internal, single-platform tags are not releases. The rolling, dated and
# short-SHA release tags are applied later by the merge phase, after the combined
# index also receives its own unique build-<run>-<attempt>-index retention tag.
#
#   1. docker-config - validate the sample app's full Docker stack (the "docker"
#      Spring profile: PostgreSQL, Redis and Ollama from
#      bootui-spring-sample-app/compose.yaml). Runs the full Maven test suite and then the
#      Playwright end-to-end suite against a sample app booted with the "docker"
#      profile, catching regressions in compose.yaml, the Redis-backed cache and the
#      Ollama / Spring AI wiring that the Docker-free build.yml does not exercise. The
#      job itself needs no Docker Hub secrets.
#
#   2. build - build, smoke-test and publish every image on every platform (a matrix
#      of 6 images x 2 platforms = 12 jobs). Each job builds its single-platform image
#      once and loads it into the runner's local Docker daemon (load: true) to
#      smoke-test it: the app must become ready (the Spring images poll GET
#      /actuator/health for status UP; the Quarkus image has no Actuator, so it polls
#      the BootUI panel manifest GET /bootui/api/panels), BootUI's back end must be
#      active (GET /bootui/api/panels) and the BootUI front end must be served
#      (GET /bootui/). The AOT image additionally verifies that CPU-specific method
#      adapter caching is disabled and runs the local Overview advisor scans, since
#      a healthy startup alone does not exercise the cached adapters that can crash.
#      The CRaC image additionally stops the
#      container and starts it again from the persisted checkpoint, verifying that the
#      restore serves BootUI and comes up at least twice as fast as the initial
#      boot-and-checkpoint start. Only once the smoke test passes does the job push that
#      exact image to Docker Hub with a build-* retention tag: the push reuses the layers just
#      built in this job's local Buildx cache (backed by a per-image, per-platform GitHub
#      Actions layer cache), so it is a cache hit that only assembles and pushes - the
#      tested image is published, never a rebuild of it, and the expensive native-image
#      compilation is never repeated. A failed build or smoke test on any image/platform
#      fails its job, so the merge phase below never runs and no release tag is applied.
#
#   3. merge - assemble the tagged multi-arch manifest list for each image (a matrix
#      of 6 images) from the per-platform digests pushed in phase 2, applying the
#      rolling `latest`, dated and short-SHA tags. Runs only if every build job
#      succeeded.
#
#   4. prune - always run, including after failed/skipped builds. Delete tags older
#      than seven days by last push (not pull), preserving latest and its entire
#      manifest graph. Upload a digest inventory BEFORE removing tags, then delete
#      unreferenced indexes before their children via the supported registry API.
#      Docker Hub reclaims unreferenced layers asynchronously; shared layers remain.
#      The inventory also recovers known legacy orphans from available Actions logs.
#
# Multi-arch is produced by building each image once per platform on a *native* runner
# (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) rather than under QEMU emulation:
# GraalVM cannot cross-compile a native image, emulated native-image / Maven builds
# would not fit the time budget, and `load: true` (used by the smoke test) only works
# with a single-platform image. Running on native runners also means each architecture
# is smoke-tested on its own hardware. Each image is built exactly once per platform, in
# the same job that smoke-tests and then pushes it, so the native image is never compiled
# a second time.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account/namespace the images are pushed to.
#   DOCKERHUB_TOKEN     Docker Hub access token (Account Settings > Personal access
#                       tokens). It must have "Read, Write, Delete" scope: Write to
#                       push images and Delete to prune tags and manifests. Do not use the
#                       account password.

on:
  schedule:
    # Every day at 07:17 UTC. Deliberately off the top of the hour: GitHub delays
    # and, under sufficiently high load, drops scheduled events during the peak
    # window at the start of each hour, so a ':00' cron is unreliable.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      prune_dry_run:
        description: 'Preview retention without deleting any tags or manifests'
        type: boolean
        default: false
      cleanup_only:
        description: 'Run retention without rebuilding the images'
        type: boolean
        default: false

concurrency:
  # All refs publish to the same repositories. Never interrupt a cleanup between
  # tag and manifest deletion, or let a second publisher race its retained graph.
  group: docker-hub-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker-config:
    name: Validate the Docker-based configuration
    if: ${{ !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            bootui-ui/src/main/frontend/package-lock.json
            bootui-spring-sample-app/e2e/package-lock.json

      - name: Build all modules and run the full test suite
        run: ./mvnw -B -ntp clean install

      - name: Install Playwright dependencies
        working-directory: bootui-spring-sample-app/e2e
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: bootui-spring-sample-app/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Pre-pull the Docker Compose images
        run: docker compose -f bootui-spring-sample-app/compose.yaml pull

      - name: Run the end-to-end suite against the Docker profile
        working-directory: bootui-spring-sample-app/e2e
        env:
          # Boot the sample app with the full Docker stack instead of the Docker-free default.
          BOOTUI_SAMPLE_PROFILES: docker
          # Allow extra time for Docker Compose to start and for Ollama to pull the chat model.
          BOOTUI_WEBSERVER_TIMEOUT: '600000'
        run: npm test

      - name: Print Docker Compose logs on failure
        if: failure()
        run: docker compose -f bootui-spring-sample-app/compose.yaml logs --no-color

      - name: Tear down any leftover Docker Compose services
        if: always()
        run: docker compose -f bootui-spring-sample-app/compose.yaml down --volumes --remove-orphans

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-docker
          path: |
            bootui-spring-sample-app/e2e/playwright-report/
            bootui-spring-sample-app/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build, smoke-test and publish ${{ matrix.image }} (${{ matrix.platform }})
    # Build each platform on a native runner: arm64 on GitHub's hosted arm64
    # runners, everything else (amd64) on the standard x86_64 runners.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Wait for the Docker-profile validation before building anything: a regression
    # there blocks every image.
    needs: docker-config
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are stored as environment secrets, so the
    # job must opt in to that environment to read them: the login raises the anonymous
    # base-image pull-rate limit, and the verified image is pushed by digest from here.
    environment: docker-hub
    # The native build dominates the runtime; allow generous headroom.
    timeout-minutes: 90
    # Only build from the canonical repository: forks lack the Docker Hub secrets.
    if: github.repository == 'jdubois/boot-ui'
    strategy:
      # Build and smoke-test every image/platform even if one fails, so a single run
      # surfaces every broken variant. Tagging is gated on all of them passing (see the
      # merge job), so fail-fast: false never causes a partial tagged publish.
      fail-fast: false
      matrix:
        image:
          - bootui-sample-app
          - bootui-sample-app-aot
          - bootui-sample-app-crac
          - bootui-sample-app-native
          - bootui-sample-app-webflux
          - bootui-sample-app-quarkus
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - image: bootui-sample-app
            dockerfile: Dockerfile
            # Plain JVM image: no special privileges; ready within a few seconds.
            run_args: ''
            health_timeout: '120'
            ready_url: /actuator/health
            ready_match: '"status":"UP"'
            # 8080 for every "classic" Spring Boot flavor (servlet/AOT/native/CRaC) - they are all
            # the same app under the hood, so they share one port.
            port: '8080'
          - image: bootui-sample-app-aot
            dockerfile: Dockerfile-aot
            # JVM + Spring AOT + JDK 25 AOT cache: no special privileges; starts
            # faster than the plain JVM image (~40–45 % shorter startup). The JDK
            # AOT cache training run happens at build time, so the container start
            # is a normal unprivileged launch.
            run_args: ''
            health_timeout: '120'
            ready_url: /actuator/health
            ready_match: '"status":"UP"'
            port: '8080'
          - image: bootui-sample-app-crac
            dockerfile: Dockerfile-crac
            # CRaC needs CRIU privileges and a checkpoint volume (see docker-compose-crac.yml).
            # The first start takes the checkpoint and then restores, so allow extra time.
            run_args: '--cap-add=CHECKPOINT_RESTORE --cap-add=SYS_PTRACE --cap-add=SYS_ADMIN --cap-add=NET_ADMIN -v bootui-smoke-crac-checkpoint:/opt/crac/checkpoint'
            health_timeout: '240'
            ready_url: /actuator/health
            ready_match: '"status":"UP"'
            port: '8080'
          - image: bootui-sample-app-native
            dockerfile: Dockerfile-native
            # GraalVM native image: no special privileges; starts in well under a second.
            run_args: ''
            health_timeout: '120'
            ready_url: /actuator/health
            ready_match: '"status":"UP"'
            port: '8080'
          - image: bootui-sample-app-webflux
            dockerfile: Dockerfile-webflux
            # Spring WebFlux/Netty reactive image: no special privileges; ready within a few
            # seconds, same as the plain servlet JVM image (it still has Actuator, so the same
            # readiness check applies).
            run_args: ''
            health_timeout: '120'
            ready_url: /actuator/health
            ready_match: '"status":"UP"'
            # 8081, matching the WebFlux sample app's own local Maven dev port (server.port=8081).
            port: '8081'
          - image: bootui-sample-app-quarkus
            dockerfile: Dockerfile-quarkus
            # Quarkus JVM image launched in dev mode (BootUI activates only outside the
            # production launch mode); no special privileges, but dev-mode re-augmentation
            # at startup makes it slower to become ready than the Spring JVM image. It has
            # no Actuator, so readiness is the BootUI panel manifest, not /actuator/health.
            run_args: ''
            health_timeout: '180'
            ready_url: /bootui/api/panels
            ready_match: '"platform"'
            # 8082, matching the Quarkus sample app's own local dev port (quarkus.http.port=8082).
            port: '8082'
    steps:
      - name: Resolve image name and platform tag
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "REGISTRY_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build the image and load it for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # Build and load into the runner's local Docker daemon so the image can be
          # smoke-tested without publishing anything. load: true needs a single-platform
          # image, which is exactly what one matrix platform produces. The local smoke
          # tag is never pushed - the publish step below pushes the verified image by
          # digest, reusing these very layers.
          push: false
          load: true
          tags: ${{ env.REGISTRY_IMAGE }}:smoke-${{ env.PLATFORM_PAIR }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image, per-platform GitHub Actions layer cache. mode=max exports every
          # layer so the publish step below can assemble and push this image from cache
          # without repeating the (expensive, native) build.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}

      - name: Smoke-test the loaded image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REF: ${{ env.REGISTRY_IMAGE }}:smoke-${{ env.PLATFORM_PAIR }}
          RUN_ARGS: ${{ matrix.run_args }}
          HEALTH_TIMEOUT: ${{ matrix.health_timeout }}
          READY_URL: ${{ matrix.ready_url }}
          READY_MATCH: ${{ matrix.ready_match }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail

          # Recognise the one CRaC failure that is an upstream defect rather than a
          # regression in this repository, so it can be tolerated *without* tolerating
          # anything else.
          #
          # Every CRaC JDK (BellSoft Liberica and Azul Zulu alike) bundles the CRaC
          # project's CRIU fork, 3.17.1-crac. CRIU <= 3.17 passes a fixed-size buffer to
          # PTRACE_SETREGSET(NT_X86_XSTATE), while a kernel running on an AMX-capable
          # Intel CPU (Sapphire/Emerald Rapids, e.g. Xeon Platinum 8573C) requires
          # exactly the AMX-inflated xsave size and returns -EFAULT otherwise. The dump
          # then aborts with "Can't set FPU registers ...: Bad address"; see
          # https://github.com/checkpoint-restore/criu/issues/2835 (fixed in CRIU 4.x).
          # GitHub's hosted amd64 fleet mixes AMD EPYC hosts (no AMX, works) with such
          # Intel hosts (always fails), so the nightly build was red purely by runner
          # lottery. arm64 is unaffected and still checkpoints on every run.
          #
          # Both conditions must hold to tolerate it: the host really is AMX-capable and
          # the dump really failed on the FPU registers. Any other CRaC failure - and any
          # failure of any other image - still fails the build. Once the bundled CRIU is
          # fixed the checkpoint simply succeeds and the normal path below runs again, so
          # this needs no follow-up removal. The dump log this greps for is surfaced by
          # checkpoint-and-run.sh, which prints CRIU's own log on a failed dump.
          crac_criu_amx_defect() {
            [ "$IMAGE_NAME" = 'bootui-sample-app-crac' ] || return 1
            grep -qw amx_tile /proc/cpuinfo || return 1
            # Write the log to a file rather than piping into `grep -q`: grep exits on the
            # first match, which SIGPIPEs `docker logs`, and `set -o pipefail` would then
            # report the whole pipeline as failed even though the pattern did match.
            docker logs bootui-smoke >/tmp/crac-smoke-logs.txt 2>&1 || return 1
            grep -q "Can't set FPU registers" /tmp/crac-smoke-logs.txt
          }

          # Start the freshly built image. The port is published on loopback only, and
          # BOOTUI_TRUST_CONTAINER_GATEWAY=AUTO lets BootUI trust the Docker bridge
          # gateway so probes from the runner over the published port are not rejected
          # by LocalhostOnlyFilter (which otherwise fails closed for non-loopback callers).
          # The port is matrix-driven (port): 8080 for the classic Spring Boot images
          # (servlet/AOT/native/CRaC), 8081 for WebFlux, 8082 for Quarkus - each image's own
          # default port, identical to its local Maven dev run.
          started_at=$(date +%s)
          docker run -d --name bootui-smoke \
            -p "127.0.0.1:${PORT}:${PORT}" \
            -e BOOTUI_TRUST_CONTAINER_GATEWAY=AUTO \
            $RUN_ARGS \
            "$IMAGE_REF"

          base_url="http://127.0.0.1:${PORT}"

          # 1. App is up: poll the readiness URL until it responds as expected. The URL
          # and the expected substring are matrix-driven (ready_url / ready_match): the
          # Spring images poll /actuator/health for "status":"UP", while the Quarkus image
          # has no Actuator and instead polls the BootUI panel manifest (/bootui/api/panels).
          # Poll once a second so the elapsed time is measured with usable resolution
          # (the CRaC restart check below compares start durations).
          echo "Waiting up to ${HEALTH_TIMEOUT}s for ${READY_URL} to become ready..."
          deadline=$(( $(date +%s) + $HEALTH_TIMEOUT ))
          until body=$(curl -fsS "${base_url}${READY_URL}" 2>/dev/null) && \
                echo "$body" | grep -q "$READY_MATCH"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "ERROR: ${READY_URL} did not become ready within ${HEALTH_TIMEOUT}s." >&2
              exit 1
            fi
            # Fail fast if the container has already exited.
            if [ "$(docker inspect -f '{{.State.Running}}' bootui-smoke 2>/dev/null)" != 'true' ]; then
              if crac_criu_amx_defect; then
                cpu=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
                echo "::warning title=CRaC checkpoint unsupported on this runner::The bundled CRIU 3.17.1-crac cannot checkpoint a JVM on this AMX-capable CPU (${cpu}) - upstream criu#2835. The image was built and started correctly; its checkpoint/restore behaviour is verified on linux/arm64 in this same run and on non-AMX amd64 runners. Publishing it unchanged."
                # Print the evidence: the "Print container logs on failure" step below does
                # not run when the job is allowed to continue.
                echo "----- container log (CPU: ${cpu}) -----"
                cat /tmp/crac-smoke-logs.txt
                echo "----- end of container log -----"
                echo "CRAC_CRIU_AMX_UNSUPPORTED=true" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "ERROR: container exited before becoming healthy." >&2
              exit 1
            fi
            sleep 1
          done
          first_start_seconds=$(( $(date +%s) - started_at ))
          echo "OK: app is ready (${READY_URL}) in ${first_start_seconds}s."
          # Export for the CRaC restart-speed check (a no-op for the other variants).
          echo "FIRST_START_SECONDS=${first_start_seconds}" >> "$GITHUB_ENV"

          # 2. BootUI back end is active: /bootui/api/panels must return HTTP 200. If
          # BootUI were silently disabled (its fail-closed default) this would 404.
          echo "Checking the BootUI API (/bootui/api/panels)..."
          curl -fsS -o /dev/null "${base_url}/bootui/api/panels"
          echo "OK: BootUI back end is active (/bootui/api/panels -> 200)."

          # 3. BootUI front end is served: /bootui/ must return the Vue SPA shell (HTTP 200).
          echo "Checking the BootUI front end (/bootui/)..."
          curl -fsS -o /dev/null "${base_url}/bootui/"
          echo "OK: BootUI front end is served (/bootui/ -> 200)."

          echo "Smoke test passed for ${IMAGE_REF}."

      - name: Verify AOT portability settings and local advisor scans
        if: matrix.image == 'bootui-sample-app-aot'
        env:
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail

          # A same-host smoke test cannot reproduce a CI-to-desktop CPU mismatch.
          # Pin the JDK-8388703 workaround as well as exercising post-startup code.
          flags=$(docker exec bootui-smoke /opt/java/bin/java \
            -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version)
          if ! grep -Eq 'bool AOTAdapterCaching[[:space:]]+=[[:space:]]+false' <<< "$flags"; then
            echo "ERROR: CPU-specific AOT method adapter caching must be disabled." >&2
            exit 1
          fi

          base_url="http://127.0.0.1:${PORT}"
          cookie_jar=$(mktemp)
          trap 'rm -f "$cookie_jar"' EXIT
          curl -fsS --max-time 15 --cookie-jar "$cookie_jar" \
            -o /dev/null "${base_url}/bootui/api/panels"
          csrf_token=$(awk '$6 == "XSRF-TOKEN" {print $7}' "$cookie_jar")
          if [ -z "$csrf_token" ]; then
            echo "ERROR: sample app did not issue a CSRF token." >&2
            exit 1
          fi

          # Use the browser's normal CSRF flow; do not weaken the sample's guards.
          # OSV/EPSS vulnerability lookups are excluded to keep this smoke test local.
          for advisor in architecture memory rest-api spring database-advisor hibernate security pentesting; do
            echo "Scanning ${advisor}..."
            report=$(curl -fsS --max-time 120 --request POST \
              --cookie "$cookie_jar" \
              --header "X-XSRF-TOKEN: ${csrf_token}" \
              --header "Origin: ${base_url}" \
              "${base_url}/bootui/api/${advisor}/scan")
            if ! jq -e '.scan.status == "SCANNED" or .scan.status == "PARTIAL"' <<< "$report" >/dev/null; then
              echo "ERROR: ${advisor} did not return a completed scan." >&2
              echo "$report" >&2
              exit 1
            fi
          done
          curl -fsS --max-time 15 "${base_url}/actuator/health" | jq -e '.status == "UP"' >/dev/null
          echo "OK: AOT local advisor scans completed and the app remains healthy."

      - name: Verify the CRaC image restarts at least 2x faster from its checkpoint
        # CRaC only: the first start above booted the app, wrote the checkpoint, then
        # restored it (and persisted the checkpoint in the named volume). Stop that
        # container and start a fresh one from the same image and volume: with a
        # checkpoint present, the entrypoint takes the restore-only path, which must
        # come up - and do so at least twice as fast as the initial
        # boot-and-checkpoint start.
        #
        # Skipped when the smoke test above hit the upstream CRIU/AMX defect: no
        # checkpoint exists on such a runner, so there is nothing to restore from.
        if: matrix.image == 'bootui-sample-app-crac' && env.CRAC_CRIU_AMX_UNSUPPORTED != 'true'
        env:
          IMAGE_REF: ${{ env.REGISTRY_IMAGE }}:smoke-${{ env.PLATFORM_PAIR }}
          RUN_ARGS: ${{ matrix.run_args }}
          HEALTH_TIMEOUT: ${{ matrix.health_timeout }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail

          # Stop and remove the first container but keep the checkpoint volume.
          echo "Stopping the first CRaC container (keeping the checkpoint volume)..."
          docker rm -f bootui-smoke

          base_url="http://127.0.0.1:${PORT}"

          # Start again from the same image and checkpoint volume (restore-only path).
          started_at=$(date +%s)
          docker run -d --name bootui-smoke-restore \
            -p "127.0.0.1:${PORT}:${PORT}" \
            -e BOOTUI_TRUST_CONTAINER_GATEWAY=AUTO \
            $RUN_ARGS \
            "$IMAGE_REF"

          echo "Waiting up to ${HEALTH_TIMEOUT}s for the restored app to report health UP..."
          deadline=$(( $(date +%s) + $HEALTH_TIMEOUT ))
          until status=$(curl -fsS "${base_url}/actuator/health" 2>/dev/null) && \
                echo "$status" | grep -q '"status":"UP"'; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "ERROR: restored app did not report health UP within ${HEALTH_TIMEOUT}s." >&2
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' bootui-smoke-restore 2>/dev/null)" != 'true' ]; then
              echo "ERROR: restored container exited before becoming healthy." >&2
              exit 1
            fi
            sleep 1
          done
          second_start_seconds=$(( $(date +%s) - started_at ))
          echo "OK: app restored and reported health UP in ${second_start_seconds}s (first start: ${FIRST_START_SECONDS}s)."

          # The restored app must still serve BootUI (back end + front end).
          curl -fsS -o /dev/null "${base_url}/bootui/api/panels"
          curl -fsS -o /dev/null "${base_url}/bootui/"
          echo "OK: BootUI back end and front end are served after the restore."

          # The restore must be at least twice as fast as the initial
          # boot-and-checkpoint start (i.e. take at most half as long). Compare with
          # multiplication to avoid integer-division rounding.
          if [ "$(( second_start_seconds * 2 ))" -gt "$FIRST_START_SECONDS" ]; then
            echo "ERROR: the restored start (${second_start_seconds}s) was not at least 2x faster than the first start (${FIRST_START_SECONDS}s)." >&2
            exit 1
          fi
          echo "OK: CRaC restore (${second_start_seconds}s) is at least 2x faster than the initial start (${FIRST_START_SECONDS}s)."

      - name: Push the smoke-tested image with a retention tag
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The smoke test above has passed (this step's default if: success() means it
          # is skipped otherwise), so publish exactly what was tested. Every layer is
          # already in this job's local Buildx cache - and in the GitHub Actions cache
          # written by the build-and-load step above (same image/platform scope) - so
          # this is a cache hit that only assembles and pushes: the (expensive, native)
          # build is never repeated. Unique retention tags also cover partial or
          # cancelled builds; merge still consumes the exact per-platform digests.
          tags: ${{ env.REGISTRY_IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          # Do not attach SLSA provenance / SBOM attestations. They would be pushed as
          # extra "unknown/unknown" manifests alongside each platform image, and once
          # the merge job flattens the per-platform digests into one manifest list those
          # attestation manifests clutter it (Docker Hub then renders the tag as having
          # phantom extra platforms instead of a clean linux/amd64 + linux/arm64 pair).
          provenance: false
          sbom: false

      - name: Save the pushed image's digest to a file
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload the digest as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs bootui-smoke || true
          docker logs bootui-smoke-restore || true

      - name: Tear down the smoke-test container
        if: always()
        run: |
          docker rm -f bootui-smoke || true
          docker rm -f bootui-smoke-restore || true
          docker volume rm -f bootui-smoke-crac-checkpoint || true

  merge:
    name: Merge ${{ matrix.image }} manifests
    runs-on: ubuntu-latest
    # Apply release tags only after every smoke-tested platform image was pushed.
    needs: build
    if: github.repository == 'jdubois/boot-ui'
    environment: docker-hub
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - bootui-sample-app
          - bootui-sample-app-aot
          - bootui-sample-app-crac
          - bootui-sample-app-native
          - bootui-sample-app-webflux
          - bootui-sample-app-quarkus
    steps:
      - name: Resolve image name
        run: echo "REGISTRY_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Download the per-platform digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          # Anchor on the '-linux-' platform segment so the base image does not also
          # match the longer image names: 'bootui-sample-app' is a prefix of
          # 'bootui-sample-app-crac' / 'bootui-sample-app-native', so a plain
          # 'digests-bootui-sample-app-*' would pull in those variants' digests and
          # then fail with "not found" (they live in different repositories).
          pattern: digests-${{ matrix.image }}-linux-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,format=short

      - name: Create the retention-tagged manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:build-${{ github.run_id }}-${{ github.run_attempt }}-index" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      # Anchor the index before moving any release tag. Otherwise two interrupted
      # publishes of the same commit/day can orphan an undiscoverable index even
      # though its platform images still have retention tags.
      - name: Apply release tags to the retained manifest list
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${REGISTRY_IMAGE}:build-${{ github.run_id }}-${{ github.run_attempt }}-index"

      - name: Inspect the published manifest list
        run: docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}"

  prune:
    name: Prune expired Docker Hub images
    runs-on: ubuntu-latest
    needs: [docker-config, build, merge]
    # Cleanup also runs after failed/skipped builds. Other refs may only preview.
    if: ${{ always() && github.repository == 'jdubois/boot-ui' && (github.ref == 'refs/heads/main' || inputs.prune_dry_run) }}
    environment: docker-hub
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PRUNE_DRY_RUN: ${{ inputs.prune_dry_run || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize retention directory
        run: echo "RETENTION_DIR=$RUNNER_TEMP/docker-retention" >> "$GITHUB_ENV"

      - name: Restore inventory or recover legacy manifest digests
        run: >
          python3 .github/scripts/docker_retention_history.py
          --namespace "$DOCKERHUB_USERNAME"
          --output "$RETENTION_DIR/previous.json"

      - name: Plan seven-day retention
        run: >
          python3 .github/scripts/docker_retention.py
          --namespace "$DOCKERHUB_USERNAME" plan
          --inventory "$RETENTION_DIR/previous.json"
          --inventory-out "$RETENTION_DIR/inventory.json"
          --output "$RETENTION_DIR/plan.json"

      # This is a write-ahead journal, not just a report. Do not move deletion
      # before the upload: otherwise a failure can orphan digests permanently.
      - name: Preserve inventory before deleting tags
        uses: actions/upload-artifact@v7
        with:
          name: docker-retention-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RETENTION_DIR }}/inventory.json
            ${{ env.RETENTION_DIR }}/plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Apply retention and confirm manifest deletion
        run: |
          args=()
          if [ "$PRUNE_DRY_RUN" = 'true' ]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/docker_retention.py \
            --namespace "$DOCKERHUB_USERNAME" apply \
            --plan "$RETENTION_DIR/plan.json" "${args[@]}"
