name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Next major, minor, or patch version to prepare. Leave empty to publish the selected tagged ref.
        required: false
        type: string
        default: ''
      skip_build:
        description: Skip the verification build before sealing the release commit and tag
        type: boolean
        default: false
      auto_publish:
        description: Publish automatically after upload to Maven Central
        type: boolean
        default: true
      resume_after_publish:
        description: Resume availability checks after an existing tagged deployment was published; skips Maven deploy
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  maven-central:
    name: Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
      actions: write
    env:
      CENTRAL_AUTO_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_publish }}
      REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      RESUME_AFTER_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_after_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        # Releases stay on the Java 17 baseline; broader JDK compatibility is
        # validated in CI by .github/workflows/jdk-compatibility.yml.
        uses: actions/setup-java@v5
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git author
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SKIP_BUILD: ${{ inputs.skip_build }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_VERSION#v}"
          TAG="v$VERSION"
          SOURCE_BRANCH="$GITHUB_REF_NAME"
          SOURCE_SHA="$GITHUB_SHA"

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release version '$RELEASE_VERSION': expected a stable major.minor.patch version"
            exit 2
          fi

          LATEST_TAG="$(
            git tag --list 'v*' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1 ||
              true
          )"
          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error::Cannot determine the latest stable release tag"
            exit 1
          fi

          LATEST_VERSION="${LATEST_TAG#v}"
          IFS=. read -r LATEST_MAJOR LATEST_MINOR LATEST_PATCH <<< "$LATEST_VERSION"
          NEXT_PATCH="$LATEST_MAJOR.$LATEST_MINOR.$((LATEST_PATCH + 1))"
          NEXT_MINOR="$LATEST_MAJOR.$((LATEST_MINOR + 1)).0"
          NEXT_MAJOR="$((LATEST_MAJOR + 1)).0.0"

          if [[ "$VERSION" != "$NEXT_PATCH" && "$VERSION" != "$NEXT_MINOR" && "$VERSION" != "$NEXT_MAJOR" ]]; then
            echo "::error::Invalid release version '$VERSION'. Latest release is $LATEST_TAG; expected $NEXT_PATCH (patch), $NEXT_MINOR (minor), or $NEXT_MAJOR (major)."
            exit 2
          fi

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Preparing a release requires running this workflow from a branch, not $GITHUB_REF_TYPE"
            exit 1
          fi

          if [[ "$RESUME_AFTER_PUBLISH" == "true" ]]; then
            echo "::error::resume_after_publish can only be used with an empty version on an existing release tag"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists locally"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin"
            exit 1
          fi

          CURRENT_VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          echo "Preparing release $TAG from $CURRENT_VERSION"

          ./mvnw -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

          export VERSION
          perl -0pi -e 's{(<artifactId>bootui-spring-boot-starter</artifactId>\s*<version>)[^<]*(</version>)}{$1$ENV{VERSION}$2}g' README.md docs/SETUP.md docs/setup/activation.md
          perl -0pi -e 's{(com\.julien-dubois\.bootui:bootui-spring-boot-starter:)[0-9][0-9A-Za-z.\-]*}{$1$ENV{VERSION}}g' docs/SETUP.md docs/setup/activation.md
          perl -0pi -e 's{(<artifactId>bootui-spring-boot-starter-reactive</artifactId>\s*<version>)[^<]*(</version>)}{$1$ENV{VERSION}$2}g' README.md docs/setup/webflux.md
          perl -0pi -e 's{(com\.julien-dubois\.bootui:bootui-spring-boot-starter-reactive:)[0-9][0-9A-Za-z.\-]*}{$1$ENV{VERSION}}g' docs/setup/webflux.md
          perl -0pi -e 's{(<artifactId>bootui-quarkus</artifactId>\s*<version>)[^<]*(</version>)}{$1$ENV{VERSION}$2}g' README.md docs/setup/quarkus.md
          perl -0pi -e 's{(com\.julien-dubois\.bootui:bootui-quarkus:)[0-9][0-9A-Za-z.\-]*}{$1$ENV{VERSION}}g' docs/setup/quarkus.md

          if ! grep -q "<version>$VERSION</version>" docs/SETUP.md; then
            echo "::error::Failed to update the bootui-spring-boot-starter version in docs/SETUP.md to $VERSION"
            exit 1
          fi

          if ! grep -q "com.julien-dubois.bootui:bootui-spring-boot-starter:$VERSION" docs/SETUP.md; then
            echo "::error::Failed to update the Gradle bootui-spring-boot-starter version in docs/SETUP.md to $VERSION"
            exit 1
          fi

          if ! grep -q "com.julien-dubois.bootui:bootui-spring-boot-starter-reactive:$VERSION" docs/setup/webflux.md; then
            echo "::error::Failed to update the Gradle bootui-spring-boot-starter-reactive version in docs/setup/webflux.md to $VERSION"
            exit 1
          fi

          if ! grep -q "com.julien-dubois.bootui:bootui-quarkus:$VERSION" docs/setup/quarkus.md; then
            echo "::error::Failed to update the Gradle bootui-quarkus version in docs/setup/quarkus.md to $VERSION"
            exit 1
          fi

          # Belt-and-braces: fail the release if any other declared dependency/plugin
          # version string still points at the previous release version anywhere in the
          # docs site or README, so a missed replacement can't silently ship stale docs.
          if grep -RnE "com\.julien-dubois\.bootui:[A-Za-z0-9_-]+:$CURRENT_VERSION" README.md docs/; then
            echo "::error::Found leftover references to the previous version ($CURRENT_VERSION) in docs/README after bumping to $VERSION"
            exit 1
          fi

          for npm_dir in . bootui-ui/src/main/frontend bootui-spring-sample-app/e2e bootui-quarkus-sample-app/e2e; do
            ( cd "$npm_dir" && npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts >/dev/null )
            if ! grep -q "\"version\": \"$VERSION\"" "$npm_dir/package.json"; then
              echo "::error::Failed to update the npm package version in $npm_dir/package.json to $VERSION"
              exit 1
            fi
          done

          if [[ "$SKIP_BUILD" != "true" ]]; then
            # No -Dgpg.passphrase here: that user property is deprecated by maven-gpg-plugin
            # ("may leak sensitive information"). The plugin already reads the passphrase from
            # the MAVEN_GPG_PASSPHRASE env var above (its passphraseEnvName default) instead.
            ./mvnw -B -ntp -Prelease clean verify
          fi

          # Fail fast if versions:set (run with -DprocessAllModules=true, so it walks every
          # pom.xml in the tree regardless of nesting depth) missed a module.
          stale_poms="$(git ls-files '*pom.xml' | xargs -I{} sh -c "grep -q '<version>$VERSION</version>' '{}' || echo '{}'")"
          if [[ -n "$stale_poms" ]]; then
            echo "::error::The following poms were not bumped to $VERSION:"
            echo "$stale_poms"
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            # Stage every tracked file touched by the version bump, including nested poms.
            git add -u
            git commit -m "Release $TAG"
          else
            echo "Project files already declare the released version; sealing current HEAD."
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"

          # Release contents are immutable once publication starts. Refuse to transplant the
          # release commit if the selected source branch moved during preparation or verification.
          git fetch --no-tags origin "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          REMOTE_SOURCE_SHA="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          if [[ "$REMOTE_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Source branch $SOURCE_BRANCH advanced from $SOURCE_SHA to $REMOTE_SOURCE_SHA while preparing $TAG. Aborting without rebasing or publishing."
            exit 1
          fi

          SIGNING_KEY="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')"
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::No GPG secret key is available to sign $TAG"
            exit 1
          fi
          git config user.signingkey "$SIGNING_KEY"

          # setup-java imports the release key and exposes its passphrase to Maven, but raw
          # git tag signing still needs a headless pinentry path. Keep the passphrase out of
          # process arguments and preserve stdin for the tag payload by passing it on fd 3.
          GPG_WRAPPER="$RUNNER_TEMP/bootui-git-gpg"
          cat > "$GPG_WRAPPER" <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --pinentry-mode loopback --passphrase-fd 3 "$@" \
            3<<<"$MAVEN_GPG_PASSPHRASE"
          EOF
          chmod 700 "$GPG_WRAPPER"
          cleanup_git_gpg() {
            git config --unset gpg.program || true
            rm -f "$GPG_WRAPPER"
          }
          trap cleanup_git_gpg EXIT
          git config gpg.program "$GPG_WRAPPER"
          git tag -s "$TAG" -m "Release $TAG"
          git verify-tag "$TAG"
          cleanup_git_gpg
          trap - EXIT

          # The branch update and tag creation must either both land or neither land. A race after
          # the explicit source check rejects this atomic push; released contents are never rebased.
          if ! git push --atomic origin \
            "HEAD:refs/heads/${SOURCE_BRANCH}" \
            "refs/tags/${TAG}:refs/tags/${TAG}"; then
            git fetch --no-tags origin "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
            echo "::error::Atomic release push failed. origin/$SOURCE_BRANCH is now $(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}"); expected $SOURCE_SHA. Aborting without rebasing or moving $TAG."
            exit 1
          fi

          echo "Sealed release $TAG at $RELEASE_SHA and pushed its commit and signed annotated tag atomically."
          echo "PREPARED_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PREPARED_RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Resolve immutable release
        run: |
         set -euo pipefail

         VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
         EXPECTED_TAG="v$VERSION"

         if [[ "$VERSION" == *-SNAPSHOT ]]; then
           echo "::error::Refusing to release snapshot version $VERSION"
           exit 1
         fi

         if [[ -n "${PREPARED_TAG:-}" && "$PREPARED_TAG" != "$EXPECTED_TAG" ]]; then
           echo "::error::Prepared tag $PREPARED_TAG does not match project version $VERSION"
           exit 1
         fi

         if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
           echo "::error::Tag $GITHUB_REF_NAME does not match project version $VERSION"
           exit 1
         fi

         if [[ "$RESUME_AFTER_PUBLISH" == "true" ]]; then
           if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || -n "$REQUESTED_VERSION" ]]; then
             echo "::error::resume_after_publish requires a manual run with an empty version"
             exit 1
           fi
           if [[ "$CENTRAL_AUTO_PUBLISH" != "true" ]]; then
             echo "::error::resume_after_publish requires auto_publish so the public artifacts can be verified"
             exit 1
           fi
         fi

         if ! git rev-parse -q --verify "refs/tags/$EXPECTED_TAG" >/dev/null; then
           git fetch --no-tags origin "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
         fi

         if [[ "$(git cat-file -t "refs/tags/$EXPECTED_TAG")" != "tag" ]]; then
           echo "::error::$EXPECTED_TAG must be an annotated tag"
           exit 1
         fi
         git verify-tag "$EXPECTED_TAG"

         RELEASE_SHA="$(git rev-parse "refs/tags/$EXPECTED_TAG^{}")"
         REMOTE_RELEASE_SHA="$(git ls-remote origin "refs/tags/$EXPECTED_TAG^{}" | awk '{ print $1 }')"
         if [[ -z "$REMOTE_RELEASE_SHA" || "$REMOTE_RELEASE_SHA" != "$RELEASE_SHA" ]]; then
           echo "::error::Remote tag $EXPECTED_TAG does not resolve to the verified local release SHA $RELEASE_SHA"
           exit 1
         fi

         if [[ -n "${PREPARED_RELEASE_SHA:-}" ]]; then
           if [[ "$PREPARED_RELEASE_SHA" != "$RELEASE_SHA" ]]; then
             echo "::error::Pushed tag $EXPECTED_TAG resolves to $RELEASE_SHA, expected $PREPARED_RELEASE_SHA"
             exit 1
           fi
         elif [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
           echo "::error::Manual or tag-triggered publication must select the commit tagged $EXPECTED_TAG ($RELEASE_SHA)"
           exit 1
         fi

         echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
         echo "RELEASE_TAG=$EXPECTED_TAG" >> "$GITHUB_ENV"
         echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
         echo "Resolved signed release $EXPECTED_TAG to immutable commit $RELEASE_SHA."

      - name: Checkout immutable release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify release version
        run: |
         set -euo pipefail

         VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
         EXPECTED_TAG="v$VERSION"

         if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
           echo "::error::Checkout moved away from immutable release SHA $RELEASE_SHA"
           exit 1
         fi

         if [[ "$VERSION" != "$RELEASE_VERSION" || "$EXPECTED_TAG" != "$RELEASE_TAG" ]]; then
           echo "::error::Immutable checkout version $VERSION does not match resolved release $RELEASE_TAG"
           exit 1
         fi

         if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" != "$RELEASE_SHA" ]]; then
           echo "::error::Release tag $RELEASE_TAG no longer resolves to $RELEASE_SHA"
           exit 1
         fi

         for npm_dir in . bootui-ui/src/main/frontend bootui-spring-sample-app/e2e bootui-quarkus-sample-app/e2e; do
            node -e '
              const fs = require("fs");
              const [dir, expected] = process.argv.slice(1);
              const pkg = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"));
              const lock = JSON.parse(fs.readFileSync(dir + "/package-lock.json", "utf8"));
              const found = [pkg.version, lock.version, lock.packages?.[""]?.version];
              for (const v of found) {
                if (v !== expected) {
                  console.error(`::error::npm version mismatch in ${dir}: expected ${expected}, found ${v}`);
                  process.exit(1);
                }
              }
            ' "$npm_dir" "$VERSION"
          done

          echo "Publishing version $VERSION from $RELEASE_SHA"

      - name: Publish to Maven Central
        if: env.RESUME_AFTER_PUBLISH != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # No -Dgpg.passphrase here: that user property is deprecated by maven-gpg-plugin
          # ("may leak sensitive information"). The plugin already reads the passphrase from
          # the MAVEN_GPG_PASSPHRASE env var above (its passphraseEnvName default) instead.
          # Build only Central distribution modules and their required reactor dependencies during
          # publication. The complete reactor was already verified before the immutable release
          # commit and tag were created.
          ./mvnw -B -ntp -Prelease clean deploy \
            -pl .,bootui-core,bootui-engine,bootui-spring-autoconfigure,bootui-spring-boot-starter,bootui-spring-boot-starter-reactive,bootui-ui,bootui-quarkus-parent,bootui-quarkus,bootui-quarkus-deployment \
            -am \
            -Dcentral.autoPublish="${CENTRAL_AUTO_PUBLISH}"

      - name: Wait for Maven Central availability
        if: env.CENTRAL_AUTO_PUBLISH == 'true'
        run: |
          set -euo pipefail

          VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          BASE="https://repo1.maven.org/maven2/com/julien-dubois/bootui"

          # Every published artifact: the parent POM and one JAR per published module.
          # This list must stay in sync with the publication reactor and Central exclusions.
          # Missing any one artifact causes the release to fail with the coordinate in the error.
          ARTIFACTS=(
            "bootui-parent/${VERSION}/bootui-parent-${VERSION}.pom"
            "bootui-quarkus-parent/${VERSION}/bootui-quarkus-parent-${VERSION}.pom"
            "bootui-core/${VERSION}/bootui-core-${VERSION}.jar"
            "bootui-engine/${VERSION}/bootui-engine-${VERSION}.jar"
            "bootui-spring-autoconfigure/${VERSION}/bootui-spring-autoconfigure-${VERSION}.jar"
            "bootui-ui/${VERSION}/bootui-ui-${VERSION}.jar"
            "bootui-spring-boot-starter/${VERSION}/bootui-spring-boot-starter-${VERSION}.jar"
            "bootui-spring-boot-starter-reactive/${VERSION}/bootui-spring-boot-starter-reactive-${VERSION}.jar"
            "bootui-quarkus/${VERSION}/bootui-quarkus-${VERSION}.jar"
            "bootui-quarkus-deployment/${VERSION}/bootui-quarkus-deployment-${VERSION}.jar"
          )

          # Sonatype Central -> Maven Central propagation can lag behind a successful
          # autoPublish, so poll until every file is downloadable (or time out).
          DEADLINE=$(( SECONDS + 45 * 60 ))
          for artifact in "${ARTIFACTS[@]}"; do
            url="${BASE}/${artifact}"
            echo "Waiting for ${url}"
            until curl -fsI "$url" >/dev/null 2>&1; do
              if (( SECONDS > DEADLINE )); then
                echo "::error::Timed out waiting for ${url} to become available on Maven Central"
                exit 1
              fi
              sleep 20
            done
            echo "Available: ${artifact}"
          done

          echo "All BootUI ${VERSION} artifacts are available on Maven Central."

      - name: Smoke test published distributions
        if: env.CENTRAL_AUTO_PUBLISH == 'true'
        run: |
          set -euo pipefail

          VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          SPRING_BOOT_VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=spring-boot.version | tail -n 1)"
          QUARKUS_VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=quarkus.platform.version | tail -n 1)"
          echo "Smoke-testing BootUI ${VERSION} against the published Maven Central artifacts."
          echo "Distributions: Spring MVC (servlet starter), Spring WebFlux (reactive starter), Quarkus extension."

          # Drop all locally built/installed BootUI artifacts so every smoke test is forced to
          # resolve them from Maven Central — exercising exactly what a consumer downloads.
          # This guard applies to all three tests below; do not re-install between them.
          rm -rf "$HOME/.m2/repository/com/julien-dubois/bootui"

          # Maximum seconds to wait for a Spring Boot app to serve the BootUI index.
          BOOTUI_SMOKE_TIMEOUT=300

          # ── Helper: probe a running Spring Boot app for the BootUI index ──────────────
          # Usage: wait_for_bootui <label> <base-url> <log-file> <app-pid>
          wait_for_bootui() {
            local label="$1" base_url="$2" log="$3" pid="$4"
            local body="" ready="" deadline=$(( SECONDS + BOOTUI_SMOKE_TIMEOUT ))
            while (( SECONDS <= deadline )); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::${label}: app exited before BootUI became available at ${base_url}."
                cat "$log"; return 1
              fi
              body="$(curl -fsSL -H 'X-Forwarded-For: 127.0.0.1' "$base_url" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -q 'id="app"'; then ready=1; break; fi
              sleep 5
            done
            if [[ -z "$ready" ]]; then
              echo "::error::${label}: BootUI did not serve its UI at ${base_url} within the timeout."
              cat "$log"; return 1
            fi
            if ! printf '%s' "$body" | grep -q '<title>BootUI</title>'; then
              echo "::error::${label}: BootUI index.html at ${base_url} is missing <title>BootUI</title>."
              printf '%s\n' "$body"; return 1
            fi
            local asset
            asset="$(printf '%s' "$body" | grep -oE 'assets/[A-Za-z0-9._-]+\.js' | head -n 1)"
            if [[ -z "$asset" ]]; then
              echo "::error::${label}: No bundled JS asset reference found in BootUI index.html."
              printf '%s\n' "$body"; return 1
            fi
            curl -fsSL -o /dev/null -H 'X-Forwarded-For: 127.0.0.1' "${base_url%/}/${asset}"
            echo "${label}: BootUI served its index and bundled assets from Maven Central successfully."
          }

          create_spring_smoke_project() {
            local project_dir="$1" artifact_id="$2" port="$3"
            mkdir -p "$project_dir/src/main/java/smoke" "$project_dir/src/main/resources"
            cat > "$project_dir/pom.xml" << SPRING_POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <parent>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-parent</artifactId>
              <version>${SPRING_BOOT_VERSION}</version>
            </parent>
            <groupId>smoke</groupId>
            <artifactId>${artifact_id}-consumer-smoke</artifactId>
            <version>1</version>
            <properties>
              <java.version>17</java.version>
            </properties>
            <dependencies>
              <dependency>
                <groupId>com.julien-dubois.bootui</groupId>
                <artifactId>${artifact_id}</artifactId>
                <version>${VERSION}</version>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-maven-plugin</artifactId>
                </plugin>
              </plugins>
            </build>
          </project>
          SPRING_POM
            cat > "$project_dir/src/main/java/smoke/SmokeApplication.java" <<'SPRING_APPLICATION'
          package smoke;

          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;

          @SpringBootApplication
          public class SmokeApplication {

              public static void main(String[] args) {
                  SpringApplication.run(SmokeApplication.class, args);
              }
          }
          SPRING_APPLICATION
            cat > "$project_dir/src/main/resources/application.properties" << SPRING_PROPERTIES
          bootui.enabled=ON
          server.port=${port}
          SPRING_PROPERTIES
          }

          # ── 1/3: Spring MVC — bootui-spring-boot-starter ─────────────────────────────
          echo "=== Smoke test 1/3: Spring MVC (bootui-spring-boot-starter) ==="
          MVC_SMOKE_DIR="$(mktemp -d)"
          create_spring_smoke_project "$MVC_SMOKE_DIR" "bootui-spring-boot-starter" "8080"
          LOG_MVC="$(mktemp)"
          # Standalone project outside the reactor; no -o (must resolve from Central).
          # fork=false keeps the app in the Maven JVM so killing this PID stops it cleanly.
          ./mvnw -B -ntp -f "$MVC_SMOKE_DIR/pom.xml" -Dmaven.test.skip=true \
            -Dspring-boot.run.fork=false \
            spring-boot:run > "$LOG_MVC" 2>&1 &
          MVC_PID=$!
          cleanup_mvc() { kill "$MVC_PID" 2>/dev/null || true; wait "$MVC_PID" 2>/dev/null || true; }
          trap cleanup_mvc EXIT
          wait_for_bootui "Spring MVC" "http://localhost:8080/bootui/" "$LOG_MVC" "$MVC_PID"
          kill "$MVC_PID" 2>/dev/null || true; wait "$MVC_PID" 2>/dev/null || true
          trap - EXIT
          echo "Spring MVC smoke test passed."

          # ── 2/3: Spring WebFlux — bootui-spring-boot-starter-reactive ─────────────────
          echo "=== Smoke test 2/3: Spring WebFlux (bootui-spring-boot-starter-reactive) ==="
          WEBFLUX_SMOKE_DIR="$(mktemp -d)"
          create_spring_smoke_project "$WEBFLUX_SMOKE_DIR" "bootui-spring-boot-starter-reactive" "8081"
          LOG_WEBFLUX="$(mktemp)"
          ./mvnw -B -ntp -f "$WEBFLUX_SMOKE_DIR/pom.xml" -Dmaven.test.skip=true \
            -Dspring-boot.run.fork=false \
            spring-boot:run > "$LOG_WEBFLUX" 2>&1 &
          WEBFLUX_PID=$!
          cleanup_webflux() { kill "$WEBFLUX_PID" 2>/dev/null || true; wait "$WEBFLUX_PID" 2>/dev/null || true; }
          trap cleanup_webflux EXIT
          wait_for_bootui "Spring WebFlux" "http://localhost:8081/bootui/" "$LOG_WEBFLUX" "$WEBFLUX_PID"
          kill "$WEBFLUX_PID" 2>/dev/null || true; wait "$WEBFLUX_PID" 2>/dev/null || true
          trap - EXIT
          echo "Spring WebFlux smoke test passed."

          # ── 3/3: Quarkus — bootui-quarkus + bootui-quarkus-deployment ────────────────
          # A minimal standalone Maven project outside the reactor exercises the full consumer
          # path: both runtime (bootui-quarkus) and deployment (bootui-quarkus-deployment)
          # artifacts are resolved from Maven Central and the extension augments successfully.
          # No HTTP server is started; a clean Quarkus build-time augmentation is the bar.
          echo "=== Smoke test 3/3: Quarkus extension (bootui-quarkus + bootui-quarkus-deployment) ==="
          QUARKUS_SMOKE_DIR="$(mktemp -d)"
          mkdir -p "$QUARKUS_SMOKE_DIR/src/main/java"
          cat > "$QUARKUS_SMOKE_DIR/pom.xml" << QUARKUS_POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>smoke</groupId>
            <artifactId>bootui-quarkus-consumer-smoke</artifactId>
            <version>1</version>
            <properties>
              <maven.compiler.release>17</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencyManagement>
              <dependencies>
                <dependency>
                  <groupId>io.quarkus.platform</groupId>
                  <artifactId>quarkus-bom</artifactId>
                  <version>${QUARKUS_VERSION}</version>
                  <type>pom</type>
                  <scope>import</scope>
                </dependency>
              </dependencies>
            </dependencyManagement>
            <dependencies>
              <!--
                Declaring bootui-quarkus (the runtime artifact) is sufficient.
                Quarkus build-time augmentation automatically resolves and downloads
                bootui-quarkus-deployment from Maven Central via the extension's
                quarkus-extension.properties, so both published coordinates are
                exercised by this single dependency declaration.
              -->
              <dependency>
                <groupId>com.julien-dubois.bootui</groupId>
                <artifactId>bootui-quarkus</artifactId>
                <version>${VERSION}</version>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>io.quarkus.platform</groupId>
                  <artifactId>quarkus-maven-plugin</artifactId>
                  <version>${QUARKUS_VERSION}</version>
                  <extensions>true</extensions>
                  <executions>
                    <execution>
                      <goals>
                        <goal>build</goal>
                        <goal>generate-code</goal>
                      </goals>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          QUARKUS_POM
          # No -am (standalone project outside the reactor); no -o (must resolve from Central).
          ./mvnw -B -ntp -f "$QUARKUS_SMOKE_DIR/pom.xml" package -Dmaven.test.skip=true
          echo "Quarkus extension smoke test passed."

          echo "All BootUI ${VERSION} distribution smoke tests passed (Spring MVC, Spring WebFlux, Quarkus)."

      - name: Redeploy documentation site
        if: env.CENTRAL_AUTO_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release push made with GITHUB_TOKEN does not trigger the Pages workflow.
          # Dispatch the immutable tag, not a branch that may have advanced while Central
          # propagated the artifacts.
          gh workflow run pages.yml --ref "$RELEASE_TAG"

      - name: Manual publish reminder
        if: env.CENTRAL_AUTO_PUBLISH != 'true'
        run: |
          cat <<'EOF'
          Auto-publish was disabled, so the deployment was uploaded to the Sonatype Central
          Portal but the artifacts are NOT yet public on Maven Central.

          The signed release tag is already immutable and must not be recreated or moved. This
          run skipped the Maven Central availability wait, the published-artifact smoke test,
          and the documentation-site redeploy.

          Finish the release by publishing the deployment in the Central Portal. Then manually
          run this Release workflow at the existing release tag with an empty version,
          auto_publish enabled, and resume_after_publish enabled. That continuation skips a
          duplicate deploy, verifies the public artifacts, runs consumer smoke tests from the
          tagged SHA, and deploys documentation from the same tag.
          EOF
