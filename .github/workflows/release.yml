name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Next major, minor, or patch version to prepare. Leave empty to publish the selected tagged ref.
        required: false
        type: string
        default: ''
      skip_build:
        description: Skip the verification build before sealing the release commit and tag
        type: boolean
        default: false
      auto_publish:
        description: Publish automatically after upload to Maven Central
        type: boolean
        default: true
      resume_after_publish:
        description: Resume availability checks after an existing tagged deployment was published; skips Maven deploy
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  maven-central:
    name: Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
      actions: write
    env:
      CENTRAL_AUTO_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_publish }}
      REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      RESUME_AFTER_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_after_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release workflow integrity
        run: bash .github/scripts/check-release-integrity.sh

      - name: Set up JDK 17
        # Releases stay on the Java 17 baseline; broader JDK compatibility is
        # validated in CI by .github/workflows/jdk-compatibility.yml.
        uses: actions/setup-java@v6
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Configure Git author
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SKIP_BUILD: ${{ inputs.skip_build }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_VERSION#v}"
          TAG="v$VERSION"
          SOURCE_BRANCH="$GITHUB_REF_NAME"
          SOURCE_SHA="$GITHUB_SHA"

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release version '$RELEASE_VERSION': expected a stable major.minor.patch version"
            exit 2
          fi

          CURRENT_VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"

          # Versions advance within the source branch's major, so a maintained older major can
          # still ship patches after a newer major exists, and only within the branch's release
          # line: `main` after `v2` merges still carries a 1.x project version but releases 2.x only,
          # and a 1.x maintenance branch never opens 2.0.0. The policy script owns the arithmetic
          # and is unit-tested by .github/scripts/test_release_version_policy.py.
          RELEASE_LINE="$(bash .github/scripts/release-version-policy.sh line-major "$CURRENT_VERSION" .github/release-line)"
          git tag --list 'v*' |
            bash .github/scripts/release-version-policy.sh next-version "$VERSION" "$CURRENT_VERSION" "$RELEASE_LINE"

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Preparing a release requires running this workflow from a branch, not $GITHUB_REF_TYPE"
            exit 1
          fi

          # Releases come from `main`, or from the maintenance branch of an older major (D40).
          if [[ "$SOURCE_BRANCH" != "main" && "$SOURCE_BRANCH" != "${VERSION%%.*}.x" ]]; then
            echo "::error::Release $VERSION must be prepared from main or ${VERSION%%.*}.x, not $SOURCE_BRANCH"
            exit 1
          fi

          if [[ "$RESUME_AFTER_PUBLISH" == "true" ]]; then
            echo "::error::resume_after_publish can only be used with an empty version on an existing release tag"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists locally"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin"
            exit 1
          fi

          echo "Preparing release $TAG from $CURRENT_VERSION"

          ./mvnw -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

          export VERSION
          perl -0pi -e 's{(<artifactId>bootui-spring-boot-starter</artifactId>\s*<version>)[^<]*(</version>)}{$1$ENV{VERSION}$2}g' README.md docs/SETUP.md docs/setup/activation.md docs/setup/webflux.md
          perl -0pi -e 's{(com\.julien-dubois\.bootui:bootui-spring-boot-starter:)[0-9][0-9A-Za-z.\-]*}{$1$ENV{VERSION}}g' docs/SETUP.md docs/setup/activation.md docs/setup/webflux.md
          perl -0pi -e 's{(<artifactId>bootui-quarkus</artifactId>\s*<version>)[^<]*(</version>)}{$1$ENV{VERSION}$2}g' README.md docs/setup/quarkus.md
          perl -0pi -e 's{(com\.julien-dubois\.bootui:bootui-quarkus:)[0-9][0-9A-Za-z.\-]*}{$1$ENV{VERSION}}g' docs/setup/quarkus.md
          perl -0pi -e 's{(com\.julien-dubois\.bootui:bootui-cli:)[0-9][0-9A-Za-z.\-]*}{$1$ENV{VERSION}}g' jbang-catalog.json README.md docs/CLI.md
          # The download snippet pins the jar through a shell variable rather than a coordinate, so the
          # substitution above does not reach it.
          perl -0pi -e 's{^VERSION=[0-9][0-9A-Za-z.\-]*$}{VERSION=$ENV{VERSION}}mg' docs/CLI.md

          if ! grep -q "<version>$VERSION</version>" docs/SETUP.md; then
            echo "::error::Failed to update the bootui-spring-boot-starter version in docs/SETUP.md to $VERSION"
            exit 1
          fi

          if ! grep -q "com.julien-dubois.bootui:bootui-spring-boot-starter:$VERSION" docs/SETUP.md; then
            echo "::error::Failed to update the Gradle bootui-spring-boot-starter version in docs/SETUP.md to $VERSION"
            exit 1
          fi

          if ! grep -q "com.julien-dubois.bootui:bootui-spring-boot-starter:$VERSION" docs/setup/webflux.md; then
            echo "::error::Failed to update the Gradle bootui-spring-boot-starter version in docs/setup/webflux.md to $VERSION"
            exit 1
          fi

          if ! grep -q "com.julien-dubois.bootui:bootui-quarkus:$VERSION" docs/setup/quarkus.md; then
            echo "::error::Failed to update the Gradle bootui-quarkus version in docs/setup/quarkus.md to $VERSION"
            exit 1
          fi

          # The JBang alias resolves a pinned coordinate, so a stale version here would leave
          # `jbang bootui@jdubois/boot-ui` installing the previous release after a successful one.
          if ! grep -q "com.julien-dubois.bootui:bootui-cli:$VERSION:all" jbang-catalog.json; then
            echo "::error::Failed to update the bootui-cli version in jbang-catalog.json to $VERSION"
            exit 1
          fi

          # A stale VERSION here would document downloading the previous release's jar.
          if ! grep -q "^VERSION=$VERSION$" docs/CLI.md; then
            echo "::error::Failed to update the CLI download version in docs/CLI.md to $VERSION"
            exit 1
          fi

          # Belt-and-braces: fail the release if any other declared dependency/plugin
          # version string still points at the previous release version anywhere in the
          # docs site or README, so a missed replacement can't silently ship stale docs.
          if grep -RnE "com\.julien-dubois\.bootui:[A-Za-z0-9_-]+:$CURRENT_VERSION" README.md docs/ jbang-catalog.json; then
            echo "::error::Found leftover references to the previous version ($CURRENT_VERSION) in docs/README after bumping to $VERSION"
            exit 1
          fi

          for npm_dir in . bootui-ui/src/main/frontend bootui-spring-sample-app/e2e bootui-quarkus-sample-app/e2e; do
            ( cd "$npm_dir" && npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts >/dev/null )
            if ! grep -q "\"version\": \"$VERSION\"" "$npm_dir/package.json"; then
              echo "::error::Failed to update the npm package version in $npm_dir/package.json to $VERSION"
              exit 1
            fi
          done

          if [[ "$SKIP_BUILD" != "true" ]]; then
            # No -Dgpg.passphrase here: that user property is deprecated by maven-gpg-plugin
            # ("may leak sensitive information"). The plugin already reads the passphrase from
            # the MAVEN_GPG_PASSPHRASE env var above (its passphraseEnvName default) instead.
            ./mvnw -B -ntp -Prelease clean verify

            # Before the release commit and tag exist, so a broken consumer POM costs nothing: stage the exact
            # Central bundle from this tree, check its coordinates and flattened POMs, and run the consumer
            # smoke tests against it.
            bash .github/scripts/stage-release-candidate.sh "$RUNNER_TEMP/bootui-candidate"
            SMOKE_LOCAL_REPO="$RUNNER_TEMP/bootui-candidate-consumers" \
              bash .github/scripts/consumer-smoke-tests.sh "$VERSION" "$RUNNER_TEMP/bootui-candidate"
            # These are the contents the tag will seal, so the pre-publication step need not test them again
            # after the tag exists, where a flaky rerun would leave a pushed tag with nothing published.
            echo "CANDIDATE_SMOKE_PASSED=true" >> "$GITHUB_ENV"
          fi

          # Fail fast if versions:set (run with -DprocessAllModules=true, so it walks every
          # pom.xml in the tree regardless of nesting depth) missed a module.
          stale_poms="$(git ls-files '*pom.xml' | xargs -I{} sh -c "grep -q '<version>$VERSION</version>' '{}' || echo '{}'")"
          if [[ -n "$stale_poms" ]]; then
            echo "::error::The following poms were not bumped to $VERSION:"
            echo "$stale_poms"
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            # Stage every tracked file touched by the version bump, including nested poms.
            git add -u
            git commit -m "Release $TAG"
          else
            echo "Project files already declare the released version; sealing current HEAD."
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"

          # Release contents are immutable once publication starts. Refuse to transplant the
          # release commit if the selected source branch moved during preparation or verification.
          git fetch --no-tags origin "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          REMOTE_SOURCE_SHA="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          if [[ "$REMOTE_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Source branch $SOURCE_BRANCH advanced from $SOURCE_SHA to $REMOTE_SOURCE_SHA while preparing $TAG. Aborting without rebasing or publishing."
            exit 1
          fi

          SIGNING_KEY="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')"
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::No GPG secret key is available to sign $TAG"
            exit 1
          fi
          git config user.signingkey "$SIGNING_KEY"

          # setup-java imports the release key and exposes its passphrase to Maven, but raw
          # git tag signing still needs a headless pinentry path. Keep the passphrase out of
          # process arguments and preserve stdin for the tag payload by passing it on fd 3.
          GPG_WRAPPER="$RUNNER_TEMP/bootui-git-gpg"
          cat > "$GPG_WRAPPER" <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --pinentry-mode loopback --passphrase-fd 3 "$@" \
            3<<<"$MAVEN_GPG_PASSPHRASE"
          EOF
          chmod 700 "$GPG_WRAPPER"
          cleanup_git_gpg() {
            git config --unset gpg.program || true
            rm -f "$GPG_WRAPPER"
          }
          trap cleanup_git_gpg EXIT
          git config gpg.program "$GPG_WRAPPER"
          git tag -s "$TAG" -m "Release $TAG"
          git verify-tag "$TAG"
          cleanup_git_gpg
          trap - EXIT

          # The branch update and tag creation must either both land or neither land. A race after
          # the explicit source check rejects this atomic push; released contents are never rebased.
          if ! git push --atomic origin \
            "HEAD:refs/heads/${SOURCE_BRANCH}" \
            "refs/tags/${TAG}:refs/tags/${TAG}"; then
            git fetch --no-tags origin "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
            echo "::error::Atomic release push failed. origin/$SOURCE_BRANCH is now $(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}"); expected $SOURCE_SHA. Aborting without rebasing or moving $TAG."
            exit 1
          fi

          echo "Sealed release $TAG at $RELEASE_SHA and pushed its commit and signed annotated tag atomically."
          echo "PREPARED_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PREPARED_RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Resolve immutable release
        run: |
         set -euo pipefail

         VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
         EXPECTED_TAG="v$VERSION"

         if [[ "$VERSION" == *-SNAPSHOT ]]; then
           echo "::error::Refusing to release snapshot version $VERSION"
           exit 1
         fi

         if [[ -n "${PREPARED_TAG:-}" && "$PREPARED_TAG" != "$EXPECTED_TAG" ]]; then
           echo "::error::Prepared tag $PREPARED_TAG does not match project version $VERSION"
           exit 1
         fi

         if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
           echo "::error::Tag $GITHUB_REF_NAME does not match project version $VERSION"
           exit 1
         fi

         if [[ "$RESUME_AFTER_PUBLISH" == "true" ]]; then
           if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || -n "$REQUESTED_VERSION" ]]; then
             echo "::error::resume_after_publish requires a manual run with an empty version"
             exit 1
           fi
           if [[ "$CENTRAL_AUTO_PUBLISH" != "true" ]]; then
             echo "::error::resume_after_publish requires auto_publish so the public artifacts can be verified"
             exit 1
           fi
         fi

         if ! git rev-parse -q --verify "refs/tags/$EXPECTED_TAG" >/dev/null; then
           git fetch --no-tags origin "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
         fi

         if [[ "$(git cat-file -t "refs/tags/$EXPECTED_TAG")" != "tag" ]]; then
           echo "::error::$EXPECTED_TAG must be an annotated tag"
           exit 1
         fi
         git verify-tag "$EXPECTED_TAG"

         RELEASE_SHA="$(git rev-parse "refs/tags/$EXPECTED_TAG^{}")"
         REMOTE_RELEASE_SHA="$(git ls-remote origin "refs/tags/$EXPECTED_TAG^{}" | awk '{ print $1 }')"
         if [[ -z "$REMOTE_RELEASE_SHA" || "$REMOTE_RELEASE_SHA" != "$RELEASE_SHA" ]]; then
           echo "::error::Remote tag $EXPECTED_TAG does not resolve to the verified local release SHA $RELEASE_SHA"
           exit 1
         fi

         if [[ -n "${PREPARED_RELEASE_SHA:-}" ]]; then
           if [[ "$PREPARED_RELEASE_SHA" != "$RELEASE_SHA" ]]; then
             echo "::error::Pushed tag $EXPECTED_TAG resolves to $RELEASE_SHA, expected $PREPARED_RELEASE_SHA"
             exit 1
           fi
         elif [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
           echo "::error::Manual or tag-triggered publication must select the commit tagged $EXPECTED_TAG ($RELEASE_SHA)"
           exit 1
         fi

         echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
         echo "RELEASE_TAG=$EXPECTED_TAG" >> "$GITHUB_ENV"
         echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
         echo "Resolved signed release $EXPECTED_TAG to immutable commit $RELEASE_SHA."

      - name: Checkout immutable release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify release version
        run: |
         set -euo pipefail

         VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
         EXPECTED_TAG="v$VERSION"

         if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
           echo "::error::Checkout moved away from immutable release SHA $RELEASE_SHA"
           exit 1
         fi

         if [[ "$VERSION" != "$RELEASE_VERSION" || "$EXPECTED_TAG" != "$RELEASE_TAG" ]]; then
           echo "::error::Immutable checkout version $VERSION does not match resolved release $RELEASE_TAG"
           exit 1
         fi

         if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" != "$RELEASE_SHA" ]]; then
           echo "::error::Release tag $RELEASE_TAG no longer resolves to $RELEASE_SHA"
           exit 1
         fi

         # Whatever triggered this run, a tag push included, the tagged contents must belong to the
         # version's own release line, so 2.x contents never publish under a 1.x coordinate.
         TAGGED_RELEASE_LINE="$(bash .github/scripts/release-version-policy.sh line-major "$VERSION" .github/release-line)"
         if [[ "$TAGGED_RELEASE_LINE" != "${VERSION%%.*}" ]]; then
           echo "::error::$RELEASE_TAG's contents declare release line $TAGGED_RELEASE_LINE in .github/release-line, not ${VERSION%%.*}"
           exit 1
         fi

         # Releases come only from `main` or from the version's maintenance branch (`1.x` for 1.x
         # patches once `main` carries 2.x), so a signed tag pushed on `v2` or any other branch cannot
         # publish before that branch is merged.
         RELEASE_MAJOR="${VERSION%%.*}"
         git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
         git fetch --no-tags origin "+refs/heads/${RELEASE_MAJOR}.x:refs/remotes/origin/${RELEASE_MAJOR}.x" 2>/dev/null || true
         RELEASE_BRANCH=""
         for candidate in main "${RELEASE_MAJOR}.x"; do
           if git rev-parse -q --verify "refs/remotes/origin/$candidate" >/dev/null &&
             git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$candidate"; then
             RELEASE_BRANCH="$candidate"
             break
           fi
         done
         if [[ -z "$RELEASE_BRANCH" ]]; then
           echo "::error::$RELEASE_TAG ($RELEASE_SHA) is on neither origin/main nor origin/${RELEASE_MAJOR}.x; releases are published only from those branches"
           exit 1
         fi
         echo "$RELEASE_TAG is on origin/$RELEASE_BRANCH."

         for npm_dir in . bootui-ui/src/main/frontend bootui-spring-sample-app/e2e bootui-quarkus-sample-app/e2e; do
            node -e '
              const fs = require("fs");
              const [dir, expected] = process.argv.slice(1);
              const pkg = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"));
              const lock = JSON.parse(fs.readFileSync(dir + "/package-lock.json", "utf8"));
              const found = [pkg.version, lock.version, lock.packages?.[""]?.version];
              for (const v of found) {
                if (v !== expected) {
                  console.error(`::error::npm version mismatch in ${dir}: expected ${expected}, found ${v}`);
                  process.exit(1);
                }
              }
            ' "$npm_dir" "$VERSION"
          done

          echo "Publishing version $VERSION from $RELEASE_SHA"

      - name: Smoke test the staged release candidate
        if: env.RESUME_AFTER_PUBLISH != 'true' && env.CANDIDATE_SMOKE_PASSED != 'true'
        run: |
          set -euo pipefail

          # The consumer check before a coordinate is consumed, from the immutable tagged checkout, for the runs
          # whose contents were not staged and smoke-tested before tagging: a tag push or a skip_build run. The
          # bundle staged here is built from the same contents the next step publishes.
          bash .github/scripts/stage-release-candidate.sh "$RUNNER_TEMP/bootui-candidate"
          SMOKE_LOCAL_REPO="$RUNNER_TEMP/bootui-candidate-consumers" \
            bash .github/scripts/consumer-smoke-tests.sh "$RELEASE_VERSION" "$RUNNER_TEMP/bootui-candidate"

      - name: Publish to Maven Central
        if: env.RESUME_AFTER_PUBLISH != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # No -Dgpg.passphrase here: that user property is deprecated by maven-gpg-plugin
          # ("may leak sensitive information"). The plugin already reads the passphrase from
          # the MAVEN_GPG_PASSPHRASE env var above (its passphraseEnvName default) instead.
          # Build only Central distribution modules and their required reactor dependencies during
          # publication. The complete reactor was already verified before the immutable release
          # commit and tag were created. bootui-agent-bridge is built here only because bootui-agent
          # shades it into the published -javaagent jar, and the two parents only because they parent
          # the reactor; the root POM's excludeArtifacts keeps all three out of the Central bundle, and
          # every published module carries a flattened, parentless POM.
          ./mvnw -B -ntp -Prelease clean deploy \
            -pl .,bootui-core,bootui-engine,bootui-spring-boot-starter,bootui-ui,bootui-quarkus-parent,bootui-quarkus,bootui-quarkus-deployment,bootui-cli,bootui-agent-bridge,bootui-agent \
            -am \
            -Dcentral.autoPublish="${CENTRAL_AUTO_PUBLISH}"

      - name: Wait for Maven Central availability
        if: env.CENTRAL_AUTO_PUBLISH == 'true'
        run: |
          set -euo pipefail

          VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          BASE="https://repo1.maven.org/maven2/com/julien-dubois/bootui"

          # Every published artifact: one JAR per published module. Neither parent POM is published.
          # This list must stay in sync with the publication reactor, the Central exclusions,
          # check-central-bundle.py, and consumer-smoke-tests.sh.
          # Missing any one artifact causes the release to fail with the coordinate in the error.
          ARTIFACTS=(
            "bootui-core/${VERSION}/bootui-core-${VERSION}.jar"
            "bootui-engine/${VERSION}/bootui-engine-${VERSION}.jar"
            "bootui-ui/${VERSION}/bootui-ui-${VERSION}.jar"
            "bootui-spring-boot-starter/${VERSION}/bootui-spring-boot-starter-${VERSION}.jar"
            "bootui-quarkus/${VERSION}/bootui-quarkus-${VERSION}.jar"
            "bootui-quarkus-deployment/${VERSION}/bootui-quarkus-deployment-${VERSION}.jar"
            "bootui-cli/${VERSION}/bootui-cli-${VERSION}.jar"
            # The runnable CLI is the shaded artifact, not the thin jar, so it is checked on its own:
            # a release that published bootui-cli but lost the shade execution would otherwise look fine
            # while `java -jar` and the JBang catalog both fail.
            "bootui-cli/${VERSION}/bootui-cli-${VERSION}-all.jar"
            # The -javaagent jar. bootui-agent-bridge is shaded inside it and is never published, so it
            # must never be polled here: it would only time out.
            "bootui-agent/${VERSION}/bootui-agent-${VERSION}.jar"
          )

          # Sonatype Central -> Maven Central propagation can lag behind a successful
          # autoPublish, so poll until every file is downloadable (or time out). The budget is
          # shared by every artifact and covers observed propagation delays well beyond an hour;
          # it is a patience limit, not a publication deadline.
          DEADLINE=$(( SECONDS + 120 * 60 ))
          for artifact in "${ARTIFACTS[@]}"; do
            url="${BASE}/${artifact}"
            echo "Waiting for ${url}"
            until curl -fsI "$url" >/dev/null 2>&1; do
              if (( SECONDS > DEADLINE )); then
                echo "::error::Timed out waiting for ${url} to become available on Maven Central"
                # Publication already succeeded; only propagation was slow. Recreating the tag or
                # redeploying would consume the coordinate, so point at the resume path instead.
                echo "::notice::The deployment was already published. Once the artifact appears, rerun this workflow at ${RELEASE_TAG} with an empty version, auto_publish enabled, and resume_after_publish enabled."
                exit 1
              fi
              sleep 20
            done
            echo "Available: ${artifact}"
          done

          echo "All BootUI ${VERSION} artifacts are available on Maven Central."

      - name: Smoke test published distributions
        if: env.CENTRAL_AUTO_PUBLISH == 'true'
        run: |
          set -euo pipefail

          VERSION="$(./mvnw -B -ntp -q -N -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"

          # The consumer smoke tests that ran against the staged candidate before publication, now against
          # Maven Central itself: Spring MVC and Spring WebFlux on the one starter, the CLI and its client,
          # the Quarkus extension, and the Java agent. With no staged repository, the script removes every
          # local BootUI artifact first and requires each one to come from Maven Central.
          bash .github/scripts/consumer-smoke-tests.sh "$VERSION"

      - name: Decide documentation redeploy
        if: env.CENTRAL_AUTO_PUBLISH == 'true'
        run: |
          set -euo pipefail

          # The documentation site follows the newest major only. A patch on an older, maintained
          # major must not replace the newer major's documentation. The decision reads the tags on
          # origin, the published world, and counts the release's own tag.
          NEWEST_MAJOR="$(
            git ls-remote --tags --refs origin 'refs/tags/v*' |
              awk '{ sub("^refs/tags/", "", $2); print $2 }' |
              bash .github/scripts/release-version-policy.sh newest-major "$RELEASE_VERSION"
          )"
          if [[ "$NEWEST_MAJOR" == "true" ]]; then
            echo "REDEPLOY_DOCS=true" >> "$GITHUB_ENV"
            echo "$RELEASE_TAG is on the newest major; the documentation site will be redeployed from it."
          elif [[ "$NEWEST_MAJOR" == "false" ]]; then
            echo "REDEPLOY_DOCS=false" >> "$GITHUB_ENV"
            echo "::notice::$RELEASE_TAG is on an older major; the documentation site stays on the newest major and is not redeployed."
          else
            echo "::error::Unexpected documentation redeploy decision '$NEWEST_MAJOR' for $RELEASE_TAG"
            exit 1
          fi

      - name: Redeploy documentation site
        if: env.CENTRAL_AUTO_PUBLISH == 'true' && env.REDEPLOY_DOCS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release push made with GITHUB_TOKEN does not trigger the Pages workflow.
          # Dispatch the immutable tag, not a branch that may have advanced while Central
          # propagated the artifacts.
          #
          # `gh workflow run` only reports that the dispatch was accepted, so the dispatched
          # run must be resolved and awaited explicitly. Otherwise a rejected or failing Pages
          # deploy leaves the release green while the published documentation stays stale.

          list_runs() {
            gh run list \
              --workflow pages.yml \
              --event workflow_dispatch \
              --branch "$RELEASE_TAG" \
              --limit 50 \
              --json databaseId \
              --jq '.[].databaseId'
          }

          # Runs that already exist for this tag must never be mistaken for the new one.
          if ! PRE_EXISTING_RUNS="$(list_runs)"; then
            echo "::error::Unable to list existing Pages runs for $RELEASE_TAG"
            exit 1
          fi

          gh workflow run pages.yml --ref "$RELEASE_TAG"
          echo "Dispatched pages.yml at $RELEASE_TAG; resolving the dispatched run."

          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 10
            CURRENT_RUNS="$(list_runs || true)"
            for candidate in $CURRENT_RUNS; do
              if ! grep -qx "$candidate" <<<"$PRE_EXISTING_RUNS"; then
                RUN_ID="$candidate"
                break
              fi
            done
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Dispatched pages.yml run for $RELEASE_TAG never became visible; documentation was not redeployed"
            exit 1
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          echo "Waiting for documentation deployment run: $RUN_URL"

          # Bound the wait so a hung Pages run cannot block the release job indefinitely.
          CONCLUSION=""
          for _ in $(seq 1 120); do
            RUN_JSON="$(gh run view "$RUN_ID" --json status,conclusion || true)"
            if [[ -z "$RUN_JSON" ]]; then
              sleep 15
              continue
            fi
            if [[ "$(jq -r '.status' <<<"$RUN_JSON")" == "completed" ]]; then
              CONCLUSION="$(jq -r '.conclusion' <<<"$RUN_JSON")"
              break
            fi
            sleep 15
          done

          if [[ -z "$CONCLUSION" ]]; then
            echo "::error::Timed out waiting for the documentation deployment run to complete: $RUN_URL"
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::Documentation deployment run concluded with '$CONCLUSION': $RUN_URL"
            exit 1
          fi

          # pages.yml's release-line gate can skip the deploy and still conclude `success`, so the
          # deploy job itself must have succeeded.
          DEPLOY_CONCLUSION="$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.name == "Deploy documentation site") | .conclusion')"
          if [[ "$DEPLOY_CONCLUSION" != "success" ]]; then
            echo "::error::The documentation run did not deploy the site (deploy job: '${DEPLOY_CONCLUSION:-missing}'); check its release-line gate: $RUN_URL"
            exit 1
          fi

          echo "Documentation site redeployed from $RELEASE_TAG: $RUN_URL"

      - name: Manual publish reminder
        if: env.CENTRAL_AUTO_PUBLISH != 'true'
        run: |
          cat <<'EOF'
          Auto-publish was disabled, so the deployment was uploaded to the Sonatype Central
          Portal but the artifacts are NOT yet public on Maven Central.

          The signed release tag is already immutable and must not be recreated or moved. This
          run skipped the Maven Central availability wait, the published-artifact smoke test,
          and the documentation-site redeploy.

          Finish the release by publishing the deployment in the Central Portal. Then manually
          run this Release workflow at the existing release tag with an empty version,
          auto_publish enabled, and resume_after_publish enabled. That continuation skips a
          duplicate deploy, verifies the public artifacts, runs consumer smoke tests from the
          tagged SHA, and deploys documentation from the same tag when that tag is on the newest
          major.
          EOF
