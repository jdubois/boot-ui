name: Pages

# The site follows the newest released major. A push to `main` or a manual run deploys only when
# release-line-gate.sh finds the branch's release line (.github/release-line) on Maven Central and no
# newer major there, so merging `v2` into `main` publishes no 2.0 documentation before the signed
# v2.0.0 tag and its artifacts exist. The Release workflow dispatches this workflow at the release tag
# once the artifacts are available. check-release-integrity.sh pins the gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.gate.outputs.publish == 'true' && steps.ci_release.outputs.publish == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether this branch may publish the site
        id: gate
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/release-line-gate.sh

      # A prepared same-major release is pushed before its Central upload. Keep the prior site
      # until this exact manifest version (all seven jars/POMs and the signed CLI all jar) is public.
      # Unavailable manifests permit explicitly labeled coming-soon docs, never a public kit.
      - name: Check exact CI documentation release availability
        id: ci_release
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: python3 .github/scripts/ci-docs-version.py publication-gate

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync starter version in setup docs
        run: |
          set -euo pipefail
          VERSION="$(perl -0ne 'print $1 and exit if m{<artifactId>bootui-parent</artifactId>\s*<version>([^<]+)</version>}' pom.xml)"
          if [[ -z "${VERSION:-}" ]]; then
            echo "::error::Could not determine the project version from pom.xml"
            exit 1
          fi
          echo "Syncing bootui-spring-boot-starter version to $VERSION"
          export VERSION
          perl -0pi -e 's{(<artifactId>bootui-spring-boot-starter</artifactId>\s*<version>)[^<]*(</version>)}{$1$ENV{VERSION}$2}g' README.md docs/SETUP.md docs/setup/activation.md
          if ! grep -q "<version>$VERSION</version>" docs/SETUP.md; then
            echo "::error::Failed to update the bootui-spring-boot-starter version in docs/SETUP.md to $VERSION"
            exit 1
          fi

      - name: Check CI and workshop navigation and exercise instructions
        run: node --test docs/.vuepress/workshop.test.mjs docs/.vuepress/ci.test.mjs

      - name: Check analytics consent handling
        run: npm run test:analytics

      - name: Check showcase media selection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_showcase_video.py'

      # Each release line selects its media-only GitHub Release, preserving older showcase assets.
      # The large MP4 is served from Pages next to that line's committed poster and captions.
      # A missing config or asset fails the build rather than publishing a broken player.
      - name: Download showcase video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHOWCASE_RELEASE="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { release } = JSON.parse(readFileSync("docs/.vuepress/showcase-video.json", "utf8"));
            if (typeof release !== "string" || !/^showcase-video(?:-v[0-9]+(?:-r[1-9][0-9]*)?)?$/.test(release)) {
              throw new Error("Invalid showcase media release");
            }
            console.log(release);
          ')"
          gh release download "$SHOWCASE_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern bootui-showcase.mp4 \
            --dir docs/.vuepress/public/videos \
            --clobber
          test -s docs/.vuepress/public/videos/bootui-showcase.mp4

      - name: Build VuePress site
        run: npm run docs:build
        env:
          VUEPRESS_BASE: /boot-ui/

      - name: Check published install scripts
        run: bash .github/scripts/check-docs-downloads.sh docs/.vuepress/dist

      - name: Check published showcase video
        run: |
          set -euo pipefail
          for asset in bootui-showcase.mp4 bootui-showcase-poster.jpg bootui-showcase.en.vtt; do
            if [[ ! -s "docs/.vuepress/dist/videos/$asset" ]]; then
              echo "::error::docs/.vuepress/dist/videos/$asset is missing from the built site"
              exit 1
            fi
          done

      - name: Check documentation fragment links
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_docs_links.py'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true' && steps.ci_release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vuepress/dist

  deploy:
    name: Deploy documentation site
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
