version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Maven 3.10.0 writes _remote.repositories and maven-metadata-local.xml into the
      # central-publishing-maven-plugin 0.11.0 staging bundle, and Maven Central rejects it
      # ("Bundle has content that does NOT have a .pom file"). Regular CI never exercises the
      # release deploy, so keep the wrapper on 3.9.x until a fixed plugin release is verified.
      - dependency-name: 'org.apache.maven:apache-maven'
        versions: ['>= 3.10.0']
    groups:
      spring-boot:
        patterns:
          - 'org.springframework.boot:*'
          - 'org.springframework:*'
      maven-plugins:
        patterns:
          - 'org.apache.maven.plugins:*'
          - 'com.github.eirslett:frontend-maven-plugin'

  - package-ecosystem: npm
    directory: /bootui-ui/src/main/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      vue:
        patterns:
          - 'vue'
          - 'vue-router'
          - '@vitejs/*'
          - 'vite'
      bootstrap:
        patterns:
          - 'bootstrap'
          - 'bootstrap-icons'
      # vitest and its coverage provider peer-depend on an exact matching
      # version, so they have to move together or npm ci fails with ERESOLVE.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      vuepress:
        patterns:
          - 'vuepress'
          - '@vuepress/*'
          - 'vue'

  - package-ecosystem: npm
    directory: /bootui-spring-sample-app/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns:
          - '@playwright/*'
          - 'prettier'

  - package-ecosystem: npm
    directory: /bootui-quarkus-sample-app/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns:
          - '@playwright/*'
          - 'prettier'

  # Trusted major tags receive compatible updates automatically; Dependabot
  # proposes new majors and new release SHAs for immutable references.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
