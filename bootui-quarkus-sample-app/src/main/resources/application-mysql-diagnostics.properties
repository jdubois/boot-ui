# Opt in with both Maven -Pmysql-diagnostics and -Dquarkus.profile=dev,mysql-diagnostics.
# This named datasource never replaces the sample's default PostgreSQL/Hibernate datasource.
# No implicit Dev Services MySQL server and no real credentials in source control.
quarkus.datasource.mysql.db-kind=mysql
quarkus.datasource.mysql.devservices.enabled=false
quarkus.datasource.mysql.jdbc.url=${BOOTUI_SAMPLE_MYSQL_URL}
quarkus.datasource.mysql.username=${BOOTUI_SAMPLE_MYSQL_USERNAME}
quarkus.datasource.mysql.password=${BOOTUI_SAMPLE_MYSQL_PASSWORD}
quarkus.datasource.mysql.jdbc.min-size=0
quarkus.datasource.mysql.jdbc.max-size=2
quarkus.datasource.mysql.jdbc.acquisition-timeout=3S
quarkus.datasource.mysql.jdbc.metrics.enabled=true
