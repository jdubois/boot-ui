quarkus.application.name=bootui-native-acceptance
quarkus.http.host=127.0.0.1
quarkus.http.root-path=/acceptance
quarkus.http.http2=true
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:native_acceptance;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.metrics.enabled=true
quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
quarkus.otel.traces.sampler=always_on
quarkus.log.category."org.acme.nativeconsole".level=INFO
bootui.path=/console
bootui.api-path=/diagnostics
bootui.expose-values=MASKED
bootui.mcp.enabled=ON
bootui.mcp.max-concurrent-calls=1
bootui.mcp.execution-timeout=PT20S
bootui.cli.enabled=true
bootui.cli.instance-discovery.enabled=true
bootui.authentication.token=native-acceptance-test-token
bootui.trust-container-gateway=OFF
bootui.show-banner=true
fixture.database.password=native-acceptance-known-secret
