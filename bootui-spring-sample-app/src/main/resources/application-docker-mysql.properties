# Lightweight Docker sample: MySQL is the primary database and Redis backs Spring Cache.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose-mysql.yaml
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.enable-statistics=true
spring.data.redis.repositories.enabled=false

# Do not create Kafka or Ollama clients, attempt broker connections, or download AI models.
spring.autoconfigure.exclude=\
  org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration,\
  org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,\
  org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration

# MySQL needs AUTO_INCREMENT and table-level foreign keys. Leave the existing PostgreSQL/H2 migration
# files and their checksums unchanged, including the two pending demo migrations.
spring.flyway.locations=classpath:db/migration-mysql
