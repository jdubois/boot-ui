# Keep BootUI's runtime history across full restarts of the sample app. Activate it beside the docker profile, as
# run-local-all.sh does: -Dspring-boot.run.profiles=docker,run-history. Both stores hold metadata only.

# Live Activity's durable persistence: the runtime journal's history is written to the application's own PostgreSQL
# database (the bootui_activity table, created on first use), so Live Activity still shows earlier runs after a restart.
bootui.activity.persistence.enabled=true

# The last run's summary, kept across a full JVM restart, so Runtime Insights compares a new run with the previous one.
# Relative to the working directory (this module); BootUI never creates the directory, so run-local-all.sh does.
bootui.runtime-journal.baseline-file=.bootui/run-baseline.bin
