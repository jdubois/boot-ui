# A distinct project prevents a previously started PostgreSQL service becoming a second JDBC candidate.
name: bootui-spring-sample-mysql

services:
  mysql:
    image: mysql:8.4.6
    command:
      - --performance-schema=ON
      - --performance-schema-consumer-statements-digest=ON
      - --performance-schema-instrument=statement/sql/%=ON
      - --performance-schema-instrument=wait/io/table/sql/handler=ON
    environment:
      MYSQL_DATABASE: bootui_sample
      MYSQL_USER: bootui
      MYSQL_PASSWORD: bootui
      MYSQL_ROOT_PASSWORD: bootui-root
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-bootui-diagnostics.sql:ro
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    extends:
      file: compose.yaml
      service: redis
