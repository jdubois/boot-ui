quarkus.http.test-port=0
quarkus.rest-client.ping-client.url=http://localhost:${quarkus.http.test-port:8083}
quarkus.rest-client.ping-client.disable-default-mapper=true
bootui.expose-values=full
bootui.mask-secrets=false
# Quarkus deliberately ignores this Spring-only opt-in and remains metadata-only.
bootui.rest-client-trace.capture-headers=true
