# Random test port to avoid parallel-build collisions — see
# bootui-quarkus-integration-tests/base/src/test/resources/application.properties for why.
quarkus.http.test-port=0

quarkus.application.name=bootui-quarkus-security-it

# Embedded basic-auth users so authentication/authorization can succeed and fail.
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=admin
quarkus.security.users.embedded.roles.admin=admin

# Fire CDI security events so QuarkusSecurityEventCapture feeds the Security Logs panel.
quarkus.security.events.enabled=true

# Native advisor evidence fixtures: exact paths, method-mismatch denial and reflected regex CORS.
quarkus.http.auth.permission.advisor-exact.paths=/advisor-policy/exact
quarkus.http.auth.permission.advisor-exact.policy=deny
quarkus.http.auth.permission.advisor-method.paths=/advisor-policy/method
quarkus.http.auth.permission.advisor-method.policy=permit
quarkus.http.auth.permission.advisor-method.methods=GET
quarkus.http.auth.permission.advisor-http-deny.paths=/advisor-policy/scopes/*
quarkus.http.auth.permission.advisor-http-deny.policy=deny
quarkus.http.auth.permission.advisor-rest-permit.paths=/advisor-policy/scopes/open
quarkus.http.auth.permission.advisor-rest-permit.policy=permit
quarkus.http.auth.permission.advisor-rest-permit.applies-to=jaxrs
quarkus.http.auth.permission.advisor-rest-deny.paths=/advisor-policy/rest-scopes/*
quarkus.http.auth.permission.advisor-rest-deny.policy=deny
quarkus.http.auth.permission.advisor-rest-deny.applies-to=jaxrs
quarkus.http.auth.permission.advisor-http-permit.paths=/advisor-policy/rest-scopes/open
quarkus.http.auth.permission.advisor-http-permit.policy=permit
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/,https://app.example

# Keep the OpenTelemetry SDK active (so QuarkusOtelTraceIdProvider resolves a real trace id at capture
# time) but export nowhere: this is an in-process correlation test, not an OTLP-export test, so no
# collector/network is needed.
quarkus.otel.traces.exporter=none
# Sample every span so the request's trace id is always available for the Live Activity correlation test.
quarkus.otel.traces.sampler=always_on
