# Random test port to avoid parallel-build collisions — see
# bootui-quarkus-integration-tests/base/src/test/resources/application.properties for why.
quarkus.http.test-port=0

# Docker-free in-memory H2 datasource so Hibernate ORM has a real database to build its metamodel against.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:hibdemo;DB_CLOSE_DELAY=-1

# Exercises QuarkusHibernatePropertyLookup's flagship value translation: the engine's ddl-auto rule only knows
# the JPA value vocabulary, so drop-and-create is mapped to the engine's risky create-drop value.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Exercises five more QuarkusHibernatePropertyLookup aliases end to end against a real SmallRye Config: without
# them, HIB-FETCH-002/HIB-CONFIG-006/HIB-CONFIG-007/HIB-CONFIG-010/HIB-CONFIG-013 would false-positive on every
# Quarkus scan even though these are correctly configured using the native Quarkus property name.
quarkus.hibernate-orm.fetch.batch-size=16
quarkus.hibernate-orm.statistics=true
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.log.queries-slower-than-ms=25
quarkus.hibernate-orm.second-level-caching-enabled=true

# Driver evidence for the Database advisor: additional JDBC properties reach the driver (and the advisor's allow-list
# filter), and a statement batch size makes the unit's JDBC batching observable. The password is a credential and must
# never be surfaced.
quarkus.datasource.jdbc.additional-jdbc-properties.reWriteBatchedInserts=true
quarkus.hibernate-orm.jdbc.statement-batch-size=25
